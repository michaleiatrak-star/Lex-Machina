[package]
name = "lex-machina-desktop"
version = "0.1.0"
description = "Lex Machina secure desktop shell"
authors = ["Lex Machina"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lex_machina_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "lex-machina"
path = "src/main.rs"

[[bin]]
name = "lex-runtime-sidecar"
path = "src/runtime_sidecar.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
getrandom = "0.4"
serde_json = "1.0"
tauri = "=2.11.5"
