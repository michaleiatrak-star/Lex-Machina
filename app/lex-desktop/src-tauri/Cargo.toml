[package]
name = "lex-machina-desktop"
version = "0.1.0"
description = "Lex Machina secure desktop shell"
authors = ["Lex Machina"]
edition = "2021"
rust-version = "1.77.2"
default-run = "lex-machina"

[lib]
name = "lex_machina_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "lex-machina"
path = "src/main.rs"

[[bin]]
name = "lex-runtime-sidecar"
path = "src/runtime_sidecar.rs"

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
getrandom = "0.4"
serde_json = "1.0"
tauri = "=2.11.5"
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
