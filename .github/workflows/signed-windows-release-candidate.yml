name: Lex Signed Windows Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-signed-online-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install runtime dependencies
        working-directory: app/lex-runtime
        run: npm install --no-audit --no-fund

      - name: Install web dependencies
        working-directory: app/lex-web
        run: npm install --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: app/lex-desktop
        run: npm install --no-audit --no-fund

      - name: Validate deterministic release contracts
        working-directory: app/lex-runtime
        run: |
          npm run typecheck
          npm test
          npm run validate:g33d

      - name: Build online bootstrap payload
        shell: pwsh
        run: ./app/installer/build-windows-online.ps1

      - name: Build NSIS installer
        working-directory: app/lex-desktop
        run: npx tauri build --bundles nsis

      - name: Locate installer and metadata directory
        id: locate
        shell: pwsh
        run: |
          $installer = Get-ChildItem "app\lex-desktop\src-tauri\target\release\bundle\nsis\*.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "SIGNED_RELEASE_INSTALLER_NOT_FOUND"
          }
          $metadata = Join-Path $env:RUNNER_TEMP "lex-signed-release-metadata"
          New-Item -ItemType Directory -Force -Path $metadata | Out-Null
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "metadata=$metadata" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($installer.FullName)"

      - name: Sign and verify Authenticode against pinned manifest trust root
        shell: pwsh
        env:
          LEX_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.LEX_WINDOWS_SIGNING_PFX_BASE64 }}
          LEX_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.LEX_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          ./app/installer/sign-windows-artifact.ps1 `
            -ArtifactPath "${{ steps.locate.outputs.installer }}" `
            -ManifestPath "app/installer/windows-release-source.json" `
            -ReceiptPath (Join-Path "${{ steps.locate.outputs.metadata }}" "Authenticode-Receipt.json")

      - name: Provision VC++ prerequisite for unattended signed acceptance
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw "app/installer/windows-release-source.json" | ConvertFrom-Json
          $vc = $manifest.systemPrerequisites.visualCppRuntime
          if ($vc.sha256 -notmatch '^[a-fA-F0-9]{64}$') {
            throw "SIGNED_ACCEPTANCE_VC_HASH_INVALID"
          }
          $target = Join-Path $env:RUNNER_TEMP "vc_redist.x64.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $vc.url -OutFile $target
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          if ($actual -ne $vc.sha256.ToLowerInvariant()) {
            throw "SIGNED_ACCEPTANCE_VC_HASH_MISMATCH"
          }
          $process = Start-Process -FilePath $target -ArgumentList @("/install", "/quiet", "/norestart") -Wait -PassThru
          if ($process.ExitCode -notin @(0, 1638, 3010)) {
            throw "SIGNED_ACCEPTANCE_VC_INSTALL_FAILED:$($process.ExitCode)"
          }

      - name: Signed installer installed-copy acceptance
        shell: pwsh
        run: |
          ./app/installer/windows-installer-acceptance.ps1 `
            -InstallerPath "${{ steps.locate.outputs.installer }}"

      - name: Generate npm CycloneDX SBOMs and Rust dependency inventory
        shell: pwsh
        run: |
          $out = "${{ steps.locate.outputs.metadata }}"
          Push-Location "app/lex-runtime"
          try {
            npm sbom --sbom-format cyclonedx | Out-File -FilePath (Join-Path $out "sbom-lex-runtime.cdx.json") -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "SBOM_RUNTIME_FAILED" }
          } finally { Pop-Location }

          Push-Location "app/lex-web"
          try {
            npm sbom --sbom-format cyclonedx | Out-File -FilePath (Join-Path $out "sbom-lex-web.cdx.json") -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "SBOM_WEB_FAILED" }
          } finally { Pop-Location }

          Push-Location "app/lex-desktop"
          try {
            npm sbom --sbom-format cyclonedx | Out-File -FilePath (Join-Path $out "sbom-lex-desktop.cdx.json") -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw "SBOM_DESKTOP_FAILED" }
          } finally { Pop-Location }

          cargo metadata --format-version 1 --manifest-path "app/lex-desktop/src-tauri/Cargo.toml" |
            Out-File -FilePath (Join-Path $out "cargo-metadata.json") -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "CARGO_METADATA_FAILED" }

      - name: Write release provenance receipt
        shell: pwsh
        run: |
          $out = "${{ steps.locate.outputs.metadata }}"
          $installer = "${{ steps.locate.outputs.installer }}"
          $releaseManifest = "app/installer/windows-release-source.json"
          $componentLock = "app/lex-desktop/src-tauri/runtime/component-lock.json"

          $files = @(
            $installer,
            $releaseManifest,
            $componentLock,
            (Join-Path $out "Authenticode-Receipt.json"),
            (Join-Path $out "sbom-lex-runtime.cdx.json"),
            (Join-Path $out "sbom-lex-web.cdx.json"),
            (Join-Path $out "sbom-lex-desktop.cdx.json"),
            (Join-Path $out "cargo-metadata.json")
          )

          $subjects = @()
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "PROVENANCE_INPUT_MISSING:$file"
            }
            $item = Get-Item -LiteralPath $file
            $subjects += [ordered]@{
              name = $item.Name
              bytes = [int64]$item.Length
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $item.FullName).Hash.ToLowerInvariant()
            }
          }

          $manifest = Get-Content -Raw -LiteralPath $releaseManifest | ConvertFrom-Json
          $provenance = [ordered]@{
            schemaVersion = 1
            kind = "LEX_MACHINA_WINDOWS_RELEASE_PROVENANCE"
            applicationVersion = [string]$manifest.applicationVersion
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            workflow = $env:GITHUB_WORKFLOW
            workflowRef = $env:GITHUB_WORKFLOW_REF
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerOs = $env:RUNNER_OS
            subjects = $subjects
            generatedAt = [DateTimeOffset]::UtcNow.ToString("o")
          }

          [IO.File]::WriteAllText(
            (Join-Path $out "release-provenance.json"),
            (($provenance | ConvertTo-Json -Depth 8) + [Environment]::NewLine),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Attest signed installer provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.locate.outputs.installer }}

      - name: Publish signed release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LexMachina-Windows-Signed-Release-Candidate
          path: |
            ${{ steps.locate.outputs.installer }}
            ${{ steps.locate.outputs.metadata }}/Authenticode-Receipt.json
            ${{ steps.locate.outputs.metadata }}/release-provenance.json
            ${{ steps.locate.outputs.metadata }}/sbom-lex-runtime.cdx.json
            ${{ steps.locate.outputs.metadata }}/sbom-lex-web.cdx.json
            ${{ steps.locate.outputs.metadata }}/sbom-lex-desktop.cdx.json
            ${{ steps.locate.outputs.metadata }}/cargo-metadata.json
            app/lex-desktop/src-tauri/runtime/component-lock.json
            app/installer/windows-release-source.json
          if-no-files-found: error
          retention-days: 14
