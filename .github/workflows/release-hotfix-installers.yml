name: Release Hotfix Installers

on:
  push:
    branches:
      - codex/hotfix-offline-lock-icon-2026-09-17

permissions:
  contents: write
  actions: read

concurrency:
  group: release-hotfix-installers
  cancel-in-progress: true

jobs:
  release-installers:
    name: Build accept and publish installer files
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install runtime dependencies
        working-directory: app/lex-runtime
        run: npm install --no-audit --no-fund

      - name: Validate offline release contract
        working-directory: app/lex-runtime
        run: npm run validate:release-offline

      - name: Install web dependencies
        working-directory: app/lex-web
        run: npm install --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: app/lex-desktop
        run: npm install --no-audit --no-fund

      - name: Build complete offline private runtime payload
        shell: pwsh
        run: ./app/installer/build-windows-offline.ps1

      - name: Verify native desktop tests
        working-directory: app/lex-desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Stage and verify offline runtime bundle
        id: runtime_bundle
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:RUNNER_TEMP "lb"
          $archiveSource = Join-Path $env:RUNNER_TEMP "la"
          $verifyRoot = Join-Path $env:RUNNER_TEMP "lv"
          foreach ($path in @($bundleDir, $archiveSource, $verifyRoot)) {
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }

          $runtime = (Resolve-Path "app/lex-desktop/src-tauri/runtime").Path
          $lockPath = Join-Path $runtime "component-lock.json"
          if (-not (Test-Path -LiteralPath $lockPath -PathType Leaf)) {
            throw "OFFLINE_RUNTIME_COMPONENT_LOCK_MISSING"
          }

          $null = robocopy.exe $runtime $archiveSource /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt 7) {
            throw "OFFLINE_ARCHIVE_SOURCE_COPY_FAILED:$LASTEXITCODE"
          }

          $bundle = Join-Path $bundleDir "LexMachina-Offline-Runtime.zip"
          & tar.exe -a -c -f $bundle -C $archiveSource .
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
            throw "OFFLINE_RUNTIME_ARCHIVE_FAILED:$LASTEXITCODE"
          }

          & tar.exe -xf $bundle -C $verifyRoot
          if ($LASTEXITCODE -ne 0) {
            throw "OFFLINE_RUNTIME_ARCHIVE_VERIFY_EXTRACT_FAILED:$LASTEXITCODE"
          }

          $lock = Get-Content -Raw -LiteralPath $lockPath | ConvertFrom-Json
          foreach ($entry in $lock.files) {
            $candidate = Join-Path $verifyRoot ($entry.path -replace '/','\')
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "OFFLINE_RUNTIME_ARCHIVE_LOCK_FILE_MISSING:$($entry.path)"
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidate).Hash.ToLowerInvariant()
            if ($actual -ne $entry.sha256.ToLowerInvariant()) {
              throw "OFFLINE_RUNTIME_ARCHIVE_LOCK_HASH_MISMATCH:$($entry.path)"
            }
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundle).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $bundle).Length
          Copy-Item -LiteralPath $lockPath -Destination (Join-Path $bundleDir "component-lock-offline.json") -Force
          "bundle=$bundle" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "bytes=$bytes" >> $env:GITHUB_OUTPUT

      - name: Rebuild thin installer payload
        shell: pwsh
        run: |
          $fullRuntime = (Resolve-Path "app/lex-desktop/src-tauri/runtime").Path
          $retiredRuntime = Join-Path $env:RUNNER_TEMP "lr"

          Get-Process -ErrorAction SilentlyContinue | ForEach-Object {
            try {
              if ($_.Path -and $_.Path.StartsWith($fullRuntime, [StringComparison]::OrdinalIgnoreCase)) {
                Stop-Process -Id $_.Id -Force -ErrorAction Stop
              }
            } catch {
              Write-Host "Process cleanup note: $($_.Exception.Message)"
            }
          }
          Start-Sleep -Seconds 2

          Remove-Item -LiteralPath $retiredRuntime -Recurse -Force -ErrorAction SilentlyContinue
          $moved = $false
          for ($attempt = 1; $attempt -le 10 -and -not $moved; $attempt++) {
            try {
              [IO.Directory]::Move($fullRuntime, $retiredRuntime)
              $moved = $true
            } catch {
              if ($attempt -eq 10) { throw }
              Start-Sleep -Seconds 2
            }
          }
          if (-not $moved -or (Test-Path -LiteralPath $fullRuntime)) {
            throw "OFFLINE_FULL_RUNTIME_RETIRE_FAILED"
          }

          ./app/installer/build-windows-online.ps1
          $receipt = [ordered]@{
            schemaVersion = 1
            bundleFile = "LexMachina-Offline-Runtime.zip"
            sha256 = "${{ steps.runtime_bundle.outputs.sha256 }}"
            bytes = [int64]"${{ steps.runtime_bundle.outputs.bytes }}"
          } | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText(
            (Join-Path (Resolve-Path "app/lex-desktop/src-tauri/runtime").Path "offline-runtime.json"),
            $receipt + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Build NSIS offline installer
        working-directory: app/lex-desktop
        env:
          CI: "true"
        run: npx tauri build --bundles nsis --config src-tauri/tauri.offline.conf.json

      - name: Assemble standalone offline installer
        id: standalone
        shell: pwsh
        run: |
          $nsis = "app/lex-desktop/src-tauri/target/release/bundle/nsis"
          $inner = Get-ChildItem $nsis -Filter "*-setup.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $inner) { throw "NSIS_OFFLINE_INSTALLER_NOT_FOUND" }

          $bundle = "${{ steps.runtime_bundle.outputs.bundle }}"
          $bundleDest = Join-Path $inner.Directory.FullName "LexMachina-Offline-Runtime.zip"
          Copy-Item -LiteralPath $bundle -Destination $bundleDest -Force
          $lockSource = Join-Path (Split-Path $bundle) "component-lock-offline.json"
          $lockDest = Join-Path $inner.Directory.FullName "component-lock-offline.json"
          Copy-Item -LiteralPath $lockSource -Destination $lockDest -Force

          $standaloneDir = Join-Path $nsis "standalone"
          New-Item -ItemType Directory -Force -Path $standaloneDir | Out-Null
          $output = Join-Path $standaloneDir "LexMachina-Offline-Setup.exe"
          ./app/installer/build-offline-standalone.ps1 `
            -InstallerPath $inner.FullName `
            -RuntimeBundlePath $bundleDest `
            -ComponentLockPath $lockDest `
            -IconPath "app/lex-desktop/src-tauri/icons/icon.ico" `
            -OutputPath $output

          $resolved = (Resolve-Path -LiteralPath $output).Path
          "installer=$resolved" >> $env:GITHUB_OUTPUT

      - name: Offline clean-machine acceptance
        shell: pwsh
        run: |
          ./app/installer/windows-installer-acceptance.ps1 `
            -InstallerPath "${{ steps.standalone.outputs.installer }}" `
            -ExpectedNetworkRequiredAtInstall $false `
            -BlockNetworkDuringInstall `
            -ForceVisualCppRuntimeInstall `
            -StandaloneOfflineExe `
            -InstallTimeoutSeconds 6000

      - name: Wait for accepted online installer from same commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $releaseDir = Join-Path $env:RUNNER_TEMP "final-release"
          Remove-Item -LiteralPath $releaseDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $marker = Join-Path $releaseDir "ONLINE-HOTFIX-HEAD.txt"
          $ready = $false
          for ($attempt = 1; $attempt -le 120; $attempt++) {
            Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
            gh release download v0.1.0 --pattern "ONLINE-HOTFIX-HEAD.txt" --dir $releaseDir --clobber --repo $repo 2>$null
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $marker -PathType Leaf)) {
              if ((Get-Content -Raw -LiteralPath $marker).Trim() -eq "${{ github.sha }}") {
                $ready = $true
                break
              }
            }
            Start-Sleep -Seconds 15
          }
          if (-not $ready) { throw "ONLINE_INSTALLER_NOT_READY_FOR_CURRENT_HEAD" }

      - name: Publish only accepted installer files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $releaseDir = Join-Path $env:RUNNER_TEMP "final-release"
          $online = Join-Path $releaseDir "Lex-Machina-0.1.0-Online-x64-Setup.exe"
          gh release download v0.1.0 --pattern "Lex-Machina-0.1.0-Online-x64-Setup.exe" --dir $releaseDir --clobber --repo $repo
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $online -PathType Leaf)) {
            throw "ONLINE_RELEASE_DOWNLOAD_FAILED"
          }

          $offline = Join-Path $releaseDir "Lex-Machina-0.1.0-Offline-x64-Setup.exe"
          Copy-Item -LiteralPath "${{ steps.standalone.outputs.installer }}" -Destination $offline -Force

          $onlineHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $online).Hash.ToLowerInvariant()
          $offlineHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $offline).Hash.ToLowerInvariant()
          $shaFile = Join-Path $releaseDir "SHA256SUMS.txt"
          [IO.File]::WriteAllLines($shaFile, @(
            "$onlineHash  Lex-Machina-0.1.0-Online-x64-Setup.exe",
            "$offlineHash  Lex-Machina-0.1.0-Offline-x64-Setup.exe"
          ), [Text.ASCIIEncoding]::new())

          gh release upload v0.1.0 $online $offline $shaFile --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "INSTALLER_RELEASE_UPLOAD_FAILED:$LASTEXITCODE" }
          Write-Host "INSTALLER_RELEASE_PASS online=$onlineHash offline=$offlineHash"
