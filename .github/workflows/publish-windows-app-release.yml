name: Publish Windows application release

on:
  push:
    branches:
      - main
    paths:
      - "WERSJA APLIKACJA/0.1.0-2026-09-17/RELEASE.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-windows-app-0.1.0-2026-09-17
  cancel-in-progress: false

env:
  RELEASE_RECORD: WERSJA APLIKACJA/0.1.0-2026-09-17/RELEASE.json

jobs:
  publish:
    name: Verify accepted EXE artifacts and publish release
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Checkout release catalog
        uses: actions/checkout@v4

      - name: Verify immutable release record and source runs
        id: record
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $record = Get-Content -Raw -LiteralPath $env:RELEASE_RECORD | ConvertFrom-Json
          $sourceSha = [string]$record.sourceSha
          $onlineRunId = [string]$record.online.runId
          $offlineRunId = [string]$record.offline.runId
          $releaseTag = [string]$record.releaseTag

          if ($sourceSha -notmatch '^[a-f0-9]{40}$') { throw "RELEASE_SOURCE_SHA_INVALID" }
          if ($onlineRunId -notmatch '^\d+$') { throw "RELEASE_ONLINE_RUN_INVALID" }
          if ($offlineRunId -notmatch '^\d+$') { throw "RELEASE_OFFLINE_RUN_INVALID" }
          if (-not $releaseTag) { throw "RELEASE_TAG_INVALID" }

          foreach ($runId in @($onlineRunId, $offlineRunId)) {
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "RELEASE_RUN_LOOKUP_FAILED:${runId}" }
            if ($run.head_sha -ne $sourceSha) {
              throw "RELEASE_RUN_HEAD_MISMATCH:${runId}:$($run.head_sha)"
            }
            if ($run.status -ne "completed" -or $run.conclusion -ne "success") {
              throw "RELEASE_RUN_NOT_SUCCESS:${runId}:$($run.status):$($run.conclusion)"
            }
          }

          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
          "online_run_id=$onlineRunId" >> $env:GITHUB_OUTPUT
          "offline_run_id=$offlineRunId" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Download accepted online artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path accepted/online | Out-Null
          gh run download "${{ steps.record.outputs.online_run_id }}" `
            --repo $env:GITHUB_REPOSITORY `
            --name "LexMachina-Windows-Online-Installer" `
            --dir "accepted/online"
          if ($LASTEXITCODE -ne 0) { throw "ONLINE_ARTIFACT_DOWNLOAD_FAILED" }

      - name: Download accepted standalone offline artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path accepted/offline | Out-Null
          gh run download "${{ steps.record.outputs.offline_run_id }}" `
            --repo $env:GITHUB_REPOSITORY `
            --name "LexMachina-Windows-Offline-Setup" `
            --dir "accepted/offline"
          if ($LASTEXITCODE -ne 0) { throw "OFFLINE_ARTIFACT_DOWNLOAD_FAILED" }

      - name: Verify receipts and assemble two EXE release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Read-Receipt([string]$Path) {
            $values = @{}
            foreach ($line in Get-Content -LiteralPath $Path) {
              if ($line -match '^([^=]+)=(.*)$') {
                $values[$matches[1].Trim()] = $matches[2].Trim()
              }
            }
            return $values
          }

          New-Item -ItemType Directory -Force -Path release | Out-Null

          $onlineInstaller = @(Get-ChildItem accepted/online -File -Recurse -Filter "*-setup.exe")
          $onlineReceipt = @(Get-ChildItem accepted/online -File -Recurse -Filter "SHA256.txt")
          if ($onlineInstaller.Count -ne 1) { throw "ONLINE_INSTALLER_COUNT_INVALID:$($onlineInstaller.Count)" }
          if ($onlineReceipt.Count -ne 1) { throw "ONLINE_RECEIPT_COUNT_INVALID:$($onlineReceipt.Count)" }
          $onlineValues = Read-Receipt $onlineReceipt[0].FullName
          $onlineHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $onlineInstaller[0].FullName).Hash.ToLowerInvariant()
          $onlineBytes = $onlineInstaller[0].Length
          if ($onlineValues.sha256 -ne $onlineHash) { throw "ONLINE_INSTALLER_HASH_MISMATCH:$onlineHash" }
          if ([int64]$onlineValues.bytes -ne $onlineBytes) { throw "ONLINE_INSTALLER_SIZE_MISMATCH:$onlineBytes" }
          Copy-Item -LiteralPath $onlineInstaller[0].FullName -Destination "release/LexMachina-Online-Setup.exe"

          $offlineInstaller = @(Get-ChildItem accepted/offline -File -Recurse -Filter "LexMachina-Offline-Setup.exe")
          $offlineReceipt = @(Get-ChildItem accepted/offline -File -Recurse -Filter "SHA256-OFFLINE.txt")
          if ($offlineInstaller.Count -ne 1) { throw "OFFLINE_STANDALONE_EXE_COUNT_INVALID:$($offlineInstaller.Count)" }
          if ($offlineReceipt.Count -ne 1) { throw "OFFLINE_RECEIPT_COUNT_INVALID:$($offlineReceipt.Count)" }
          $offlineValues = Read-Receipt $offlineReceipt[0].FullName
          $offlineHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $offlineInstaller[0].FullName).Hash.ToLowerInvariant()
          $offlineBytes = $offlineInstaller[0].Length
          if ($offlineValues.sha256 -ne $offlineHash) { throw "OFFLINE_STANDALONE_HASH_MISMATCH:$offlineHash" }
          if ([int64]$offlineValues.bytes -ne $offlineBytes) { throw "OFFLINE_STANDALONE_SIZE_MISMATCH:$offlineBytes" }
          Copy-Item -LiteralPath $offlineInstaller[0].FullName -Destination "release/LexMachina-Offline-Setup.exe"

          @(
            "source_sha=${{ steps.record.outputs.source_sha }}",
            "online_file=LexMachina-Online-Setup.exe",
            "online_sha256=$onlineHash",
            "online_bytes=$onlineBytes",
            "offline_file=LexMachina-Offline-Setup.exe",
            "offline_sha256=$offlineHash",
            "offline_bytes=$offlineBytes"
          ) | Set-Content -LiteralPath "release/SHA256-RELEASE.txt" -Encoding utf8
          Copy-Item -LiteralPath $env:RELEASE_RECORD -Destination "release/RELEASE-MANIFEST.json"

          Write-Host "ONLINE_RELEASE_SHA256=$onlineHash"
          Write-Host "OFFLINE_RELEASE_SHA256=$offlineHash"
          Get-Content -LiteralPath "release/SHA256-RELEASE.txt"

      - name: Prepare release notes
        shell: pwsh
        run: |
          @'
          # Lex Machina — Windows application 0.1.0

          This release contains exactly two Windows installers:

          - `LexMachina-Online-Setup.exe` — verified online bootstrap installer.
          - `LexMachina-Offline-Setup.exe` — single-file offline installer containing its complete private runtime payload. No adjacent runtime ZIP is required.

          `SHA256-RELEASE.txt` contains the release hashes and byte counts. `RELEASE-MANIFEST.json` records the accepted source SHA and workflow provenance.

          Both files are published only after their exact source workflow runs finish with `success`; the offline EXE additionally passes clean-machine installed-copy acceptance with network blocked during installation.
          '@ | Set-Content -LiteralPath "release/RELEASE-NOTES.md" -Encoding utf8

      - name: Publish immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.record.outputs.release_tag }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "RELEASE_TAG_ALREADY_EXISTS:$tag" }

          gh release create $tag `
            "release/LexMachina-Online-Setup.exe" `
            "release/LexMachina-Offline-Setup.exe" `
            "release/SHA256-RELEASE.txt" `
            "release/RELEASE-MANIFEST.json" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Lex Machina Windows 0.1.0 — 2026-09-17" `
            --notes-file "release/RELEASE-NOTES.md" `
            --draft
          if ($LASTEXITCODE -ne 0) { throw "RELEASE_CREATE_FAILED" }

          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw "RELEASE_PUBLISH_FAILED" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY
