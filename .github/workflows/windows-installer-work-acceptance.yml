name: Windows Installer Work Acceptance

on:
  push:
    branches:
      - "work/rc3-hf2-brand-icon"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-work-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-regression:
    name: Default admin password rotation regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install runtime test dependencies
        working-directory: app/lex-runtime
        run: npm install --no-audit --no-fund

      - name: Verify default-admin password rotation survives restart
        working-directory: app/lex-runtime
        run: npx vitest run tests/g37b-password-setup.test.ts

      - name: Install web dependencies
        working-directory: app/lex-web
        run: npm install --no-audit --no-fund

      - name: Compile authentication UI
        working-directory: app/lex-web
        run: npm run build

  online:
    name: Canonical Windows installer acceptance
    uses: ./.github/workflows/lex-installer.yml
