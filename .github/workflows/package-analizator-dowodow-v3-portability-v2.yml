name: Package analizator-dowodow-v3 portability v2

on:
  push:
    branches:
      - portability/analizator-dowodow-v3-01
    paths:
      - '.github/workflows/package-analizator-dowodow-v3-portability-v2.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4

      - name: Stage complete skill and minimally adapt runtime layer
        shell: bash
        run: |
          set -euo pipefail
          SRC='Wersja rozwojowa rozpakowana/analizator-dowodow-v3'
          ROOT='staging/analizator-dowodow-v3'
          rm -rf staging
          mkdir -p staging
          cp -a "$SRC" "$ROOT"
          SRC_COUNT=$(find "$SRC" -type f | wc -l | tr -d ' ')
          DST_COUNT=$(find "$ROOT" -type f | wc -l | tr -d ' ')
          echo "original source files=$SRC_COUNT staged=$DST_COUNT"
          test "$SRC_COUNT" = "$DST_COUNT"

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('staging/analizator-dowodow-v3/SKILL.md')
          text=p.read_text(encoding='utf-8')
          text=text.replace('compatibility: "web_search, bash, document_analysis"','compatibility: "live_web_lookup, document_analysis, optional_shell_and_ui"',1)
          pat=re.compile(r'description: \|\n(?:  .*\n)+?  Nigdy nie oceniaj bez wystarczających informacji — pytaj najpierw\.\n',re.M)
          repl=('description: "Analiza dowodów, akt, pism, zeznań, nagrań i korespondencji: '
                'siła dowodowa, sprzeczności, pokrycie przesłanek, terminy, analiza śledcza i narracja; opcjonalny dashboard."\n')
          text,n=pat.subn(repl,text,count=1)
          if n!=1: raise SystemExit('description block not found exactly once')
          adapter=[
            '## ADAPTER RUNTIME — PORTABILITY (ChatGPT / Claude / inne hosty)',
            '',
            'Ta sekcja zmienia wyłącznie sposób wykonania operacji technicznych. Nie zmienia metodologii dowodowej, scoringu, bramek, modułów MP/MD/MX, zasad procesowych ani danych dashboardu.',
            '',
            '1. `view`, `web_search`, `web_fetch`, `bash`, `show_widget`, `visualize:read_me`, `present_files` i podobne nazwy traktuj jako nazwy operacji semantycznych, jeśli bieżący host nie udostępnia literalnie narzędzia o tej nazwie. Użyj równoważnej funkcji hosta.',
            '2. `view /mnt/skills/user/analizator-dowodow-v3/...` oznacza świeży odczyt odpowiedniego pliku lokalnego tego skilla (`modules/`, `references/`, `assets/`, `checklists/`, `templates/`). Nie wymagaj literalnego `/mnt/skills`.',
            '3. `view /mnt/skills/user/shared/<plik>` oznacza świeży odczyt z osobnego, kanonicznego skilla `shared`. NIE kopiuj pliku `shared` lokalnie do tego skilla. Użyj mechanizmu dostępu do zainstalowanego `shared` dostępnego w hoście; jeśli obowiązkowy zasób jest niedostępny, zastosuj fail-closed zamiast pamięci modelu.',
            '4. Ścieżki `/mnt/user-data/...` lub podobne oznaczają rzeczywiste pliki użytkownika dostępne w bieżącym hoście. Operacja `view` na dowodzie oznacza ponowne otwarcie/odczyt źródła, nie przypomnienie treści z kontekstu.',
            '5. `web_search` / `web_fetch` oznaczają świeże wyszukanie i odczyt źródła. Dla prawa i orzecznictwa zachowaj wszystkie istniejące hard gate’y, źródła oficjalne i zakaz cytowania z pamięci.',
            '6. Instrukcje `bash`, `python`, `pdftotext`, `pdftoppm`, `openpyxl`, `zipfile` są preferowanymi technikami pomocniczymi, gdy host daje dostęp do takich narzędzi. Jeśli nie daje, użyj natywnego parsera pliku/obrazu, zachowując ten sam wymóg kompletności.',
            '7. Dashboard HTML i widget-kreator są częścią skilla. Gdy host obsługuje interaktywny HTML/widget, użyj go. Gdy nie obsługuje, zachowaj ten sam model danych i funkcje jako ustrukturyzowany raport lub natywny artefakt hosta; nie pomijaj analizy z powodu braku renderera.',
            '8. Odwołania do innych skilli są integracjami między-skillowymi. Nie kopiuj ich do tej paczki. Jeśli integracja jest niedostępna, wykonaj część lokalną możliwą do wykonania i jawnie oznacz pominięty krok bez tworzenia fikcyjnego wyniku.',
            '',
            '**Zasada nadrzędna adaptera:** jeśli istniejąca instrukcja jest zrozumiała i wykonalna przez bieżący host, wykonaj ją bez konwersji. Adapter ma znaczenie tylko wtedy, gdy literalna nazwa narzędzia, ścieżka lub renderer jest zależny od runtime.',
            '',
          ]
          marker='---\n\n# Analizator Dowodów Procesowych v5'
          if marker not in text: raise SystemExit('frontmatter closing marker not found')
          text=text.replace(marker,'---\n\n'+'\n'.join(adapter)+'# Analizator Dowodów Procesowych v5',1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Verify all external shared references exist without copying them
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('staging/analizator-dowodow-v3')
          shared=Path('Wersja rozwojowa rozpakowana/shared')
          pats=[
            re.compile(r'/mnt/skills/user/shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml|html))'),
            re.compile(r'(?<![A-Za-z0-9_.\-/])shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml|html))'),
          ]
          refs=set()
          for f in [x for x in root.rglob('*') if x.is_file() and x.suffix.lower() in {'.md','.txt','.json','.py','.sh','.yaml','.yml','.html'}]:
            try: data=f.read_text(encoding='utf-8')
            except UnicodeDecodeError: continue
            for p in pats: refs.update(m.group(1) for m in p.finditer(data))
          missing=[r for r in sorted(refs) if not (shared/r).is_file()]
          if missing: raise SystemExit('Missing canonical shared dependencies: '+', '.join(missing))
          print('Verified external shared references:',len(refs))
          for r in sorted(refs): print('shared/'+r)
          PY

      - name: Manifest checksums and validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('staging/analizator-dowodow-v3')
          source=Path('Wersja rozwojowa rozpakowana/analizator-dowodow-v3')
          original_count=sum(1 for p in source.rglob('*') if p.is_file())
          text=(root/'SKILL.md').read_text(encoding='utf-8')
          m=re.search(r'^description:\s*"(.*?)"\s*$',text,re.M)
          if not m: raise SystemExit('portable description not found')
          desc_len=len(m.group(1))
          if desc_len>200: raise SystemExit(f'description too long: {desc_len}')
          manifest=[
            '# Portability manifest — analizator-dowodow-v3','',
            '- Source repository: `michaleiatrak-star/Lex-Machina`',
            '- Source commit: `bdebb4b0b6ba63add44501795c6e4acdc5bfd931`',
            '- Original skill tree SHA: `506029c7bfa614b38e2247dcbce2d58a1cc2a1f7`',
            f'- Original skill files copied before portability additions: **{original_count}**',
            f'- Frontmatter description length: **{desc_len}/200**','',
            '## Zasada shared','',
            '`shared` pozostaje osobnym kanonicznym skillem. Ten ZIP NIE zawiera kopii plików `shared`; build jedynie potwierdził, że wszystkie wskazane zależności istnieją w kanonicznym katalogu repo.',
            '',
            '## Zmiany wyłącznie runtime portability','',
            '1. Neutralne capability metadata zamiast nazw narzędzi konkretnego hosta.',
            '2. Skrócony tylko frontmatter `description`; szczegółowe triggery i metodologia pozostają w skillu.',
            '3. Dodany adapter interpretujący legacy nazwy narzędzi i `/mnt/...` jako operacje semantyczne.',
            '4. Dashboard HTML, widget-kreator, moduły MP/MD/MX, checklisty, templates i references zachowane.',
            '5. Inne skille, w tym `shared`, pozostają odrębnymi skillami i nie są vendoringowane.',
            '',
            '## Zasada nienaruszania instrukcji','',
            'Instrukcje zrozumiałe i wykonalne przez host pozostają bez zmian; adapter działa tylko na granicy runtime.',''
          ]
          (root/'PORTABILITY-MANIFEST.md').write_text('\n'.join(manifest),encoding='utf-8')
          rows=[]
          for f in sorted(p for p in root.rglob('*') if p.is_file() and p.name!='CHECKSUMS.sha256'):
            rows.append(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.relative_to(root).as_posix()}')
          (root/'CHECKSUMS.sha256').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY

          ROOT='staging/analizator-dowodow-v3'
          COUNT=$(find "$ROOT" -type f | wc -l | tr -d ' ')
          echo "FINAL_FILES=$COUNT"
          if [ "$COUNT" -gt 200 ]; then echo "ERROR: final skill has $COUNT files; hard limit 200" >&2; exit 1; fi
          test -f "$ROOT/SKILL.md"
          test -f "$ROOT/assets/dashboard.html"
          test -f "$ROOT/assets/widget-kreator.html"
          test -d "$ROOT/modules"
          test -d "$ROOT/references"
          test -d "$ROOT/checklists"
          test -d "$ROOT/templates"
          test ! -d "$ROOT/shared"
          grep -q '^## ADAPTER RUNTIME — PORTABILITY' "$ROOT/SKILL.md"
          ! grep -q 'compatibility: "web_search, bash, document_analysis"' "$ROOT/SKILL.md"
          (cd "$ROOT" && sha256sum -c CHECKSUMS.sha256)

      - name: Upload one skill as one ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: analizator-dowodow-v3
          path: staging
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
