name: Lex Model Pack Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Model-pack metadata version (semver)"
        required: true
        type: string
      min_app_version:
        description: "Minimum compatible Lex Machina app version"
        required: true
        default: "0.1.3"
        type: string
      max_app_version:
        description: "Maximum compatible app version, or - for no maximum"
        required: true
        default: "0.2.0"
        type: string
      key_id:
        description: "Trusted Ed25519 model-pack signing key id"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-signed-model-pack-metadata:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install runtime dependencies
        working-directory: app/lex-runtime
        run: npm install --no-audit --no-fund

      - name: Validate runtime and signed model-pack verifier
        working-directory: app/lex-runtime
        run: |
          npm run typecheck
          npm test

      - name: Require model-pack Ed25519 signing secret
        shell: pwsh
        env:
          LEX_MODEL_PACK_PRIVATE_KEY_PEM: ${{ secrets.LEX_MODEL_PACK_PRIVATE_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LEX_MODEL_PACK_PRIVATE_KEY_PEM)) {
            throw "MODEL_PACK_RELEASE_PRIVATE_KEY_MISSING"
          }

      - name: Build signed model-pack index
        shell: pwsh
        env:
          LEX_MODEL_PACK_PRIVATE_KEY_PEM: ${{ secrets.LEX_MODEL_PACK_PRIVATE_KEY_PEM }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP "lex-model-pack-release"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Push-Location "app/lex-runtime"
          try {
            npm run build:model-pack-release -- `
              "../installer/windows-release-source.json" `
              "$output" `
              "${{ inputs.version }}" `
              "${{ inputs.min_app_version }}" `
              "${{ inputs.max_app_version }}" `
              "${{ inputs.key_id }}"
            if ($LASTEXITCODE -ne 0) {
              throw "MODEL_PACK_RELEASE_BUILD_FAILED"
            }
          } finally {
            Pop-Location
          }
          "LEX_MODEL_PACK_RELEASE_DIR=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record model-pack metadata hashes
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath $env:LEX_MODEL_PACK_RELEASE_DIR -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              Write-Host "$($_.Name)  $hash  $($_.Length)"
            }

      - name: Publish signed model-pack release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LexMachina-ModelPack-${{ inputs.version }}-Signed-Candidate
          path: |
            ${{ env.LEX_MODEL_PACK_RELEASE_DIR }}/LexMachina-ModelPack-Index.json
            ${{ env.LEX_MODEL_PACK_RELEASE_DIR }}/LexMachina-ModelPack-Index.sig
            app/installer/windows-release-source.json
          if-no-files-found: error
          retention-days: 14
