name: Lex Runtime Validation

on:
  pull_request:
    paths:
      - "app/lex-runtime/**"
      - "app/lex-web/**"
      - "app/lex-version.yaml"
      - "Wersja rozwojowa rozpakowana/**"
      - ".github/workflows/lex-runtime.yml"
  push:
    branches:
      - feature/local-runtime
    paths:
      - "app/lex-runtime/**"
      - "app/lex-web/**"
      - "app/lex-version.yaml"
      - "Wersja rozwojowa rozpakowana/**"
      - ".github/workflows/lex-runtime.yml"

permissions:
  contents: read

jobs:
  g1-g13:
    name: G1-G13 runtime validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/lex-runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Unit tests — runtime and app contracts
        run: npm test

      - name: G1 — corpus integrity
        run: npm run validate:corpus

      - name: G3 — router-first bootstrap on full corpus
        run: npm run validate:g3

      - name: G4 — Tool Broker safety
        run: npm run validate:g4

      - name: G5 — Provider conformance
        run: npm run validate:g5

      - name: G7 — deterministic vertical slice
        run: npm run validate:g7

      - name: G8 — HARD GATE finalization
        run: npm run validate:g8

      - name: G9 — audit completeness
        run: npm run validate:g9

      - name: G10 — export gate
        run: npm run validate:g10

      - name: G11 — skill contract matrix
        run: npm run validate:g11

      - name: G12 — dynamic model catalog
        run: npm run validate:g12

      - name: G13 — localhost HTTP API
        run: npm run validate:g13

  g14-web:
    name: G14 local web UI
    needs: g1-g13
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/lex-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Web unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: G14 — browser bundle safety
        run: npm run validate:g14
