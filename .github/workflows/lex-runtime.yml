name: Lex Runtime Validation

on:
  pull_request:
    paths:
      - "app/lex-runtime/**"
      - "app/lex-version.yaml"
      - "Wersja rozwojowa rozpakowana/**"
      - ".github/workflows/lex-runtime.yml"
  push:
    branches:
      - feature/local-runtime
    paths:
      - "app/lex-runtime/**"
      - "app/lex-version.yaml"
      - "Wersja rozwojowa rozpakowana/**"
      - ".github/workflows/lex-runtime.yml"

permissions:
  contents: read

jobs:
  g1-g3:
    name: G1-G3 corpus, resolver and router bootstrap
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/lex-runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests — resolver and router-first safety
        run: npm test

      - name: G1 — corpus integrity
        run: npm run validate:corpus

      - name: G3 — router-first bootstrap on full corpus
        run: npm run validate:g3
