name: Lex Local AI Context Benchmark

on:
  workflow_dispatch:
    inputs:
      runtime_root:
        description: "Installed Lex Machina runtime root containing release-source.json"
        required: true
        type: string
      local_ai_root:
        description: "Existing %LOCALAPPDATA%\\LexMachina\\local-ai root with a provisioned model"
        required: true
        type: string
      model_id:
        description: "Optional exact installed local model id; blank uses the configured model"
        required: false
        default: ""
        type: string
      profiles:
        description: "Comma-separated context profiles"
        required: true
        default: "64000,96000,128000,160000,200000"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - lex-local-ai-benchmark
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Validate benchmark host inputs
        shell: pwsh
        env:
          LEX_RUNTIME_ROOT: ${{ inputs.runtime_root }}
          LEX_LOCAL_LLM_ROOT: ${{ inputs.local_ai_root }}
        run: |
          if (-not (Test-Path -LiteralPath (Join-Path $env:LEX_RUNTIME_ROOT "release-source.json") -PathType Leaf)) {
            throw "LOCAL_CONTEXT_BENCHMARK_RUNTIME_MANIFEST_MISSING"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:LEX_RUNTIME_ROOT "bootstrap\install-local-llm.ps1") -PathType Leaf)) {
            throw "LOCAL_CONTEXT_BENCHMARK_PROVISIONER_MISSING"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:LEX_LOCAL_LLM_ROOT "config.json") -PathType Leaf)) {
            throw "LOCAL_CONTEXT_BENCHMARK_MODEL_NOT_CONFIGURED"
          }

      - name: Install runtime development dependencies
        working-directory: app/lex-runtime
        run: npm install --no-audit --no-fund

      - name: Run real 64k-200k context benchmark
        id: benchmark
        shell: pwsh
        continue-on-error: true
        env:
          LEX_RUNTIME_ROOT: ${{ inputs.runtime_root }}
          LEX_LOCAL_LLM_ROOT: ${{ inputs.local_ai_root }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP "LexMachina-Local-Context-Benchmark.json"
          $args = @(
            "run",
            "benchmark:local-context",
            "--",
            "--output=$out",
            "--profiles=${{ inputs.profiles }}"
          )
          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.model_id }}")) {
            $args += "--model=${{ inputs.model_id }}"
          }

          & npm @args
          $code = $LASTEXITCODE
          "report=$out" >> $env:GITHUB_OUTPUT
          "exit_code=$code" >> $env:GITHUB_OUTPUT

          if (-not (Test-Path -LiteralPath $out -PathType Leaf)) {
            throw "LOCAL_CONTEXT_BENCHMARK_REPORT_MISSING"
          }

      - name: Publish benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LexMachina-Local-Context-Benchmark-${{ github.run_id }}
          path: ${{ steps.benchmark.outputs.report }}
          if-no-files-found: error
          retention-days: 30

      - name: Enforce benchmark qualification result
        if: always()
        shell: pwsh
        run: |
          $code = "${{ steps.benchmark.outputs.exit_code }}"
          if ([string]::IsNullOrWhiteSpace($code)) {
            throw "LOCAL_CONTEXT_BENCHMARK_DID_NOT_RUN"
          }
          if ([int]$code -ne 0) {
            throw "LOCAL_CONTEXT_BENCHMARK_QUALIFICATION_FAILED"
          }
          Write-Host "Local context benchmark qualification: PASS"
