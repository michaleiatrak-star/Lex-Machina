name: Package audyt-systemu-v4 portability v2

on:
  push:
    branches:
      - portability/audyt-systemu-v4-01
    paths:
      - '.github/workflows/package-audyt-systemu-v4-portability-v2.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4

      - name: Stage complete skill tree
        shell: bash
        run: |
          set -euo pipefail
          SRC='Wersja rozwojowa rozpakowana/audyt-systemu-v4'
          ROOT='staging/audyt-systemu-v4'
          rm -rf staging
          mkdir -p staging
          cp -a "$SRC" "$ROOT"
          SRC_COUNT=$(find "$SRC" -type f -not -path '*/__pycache__/*' | wc -l | tr -d ' ')
          DST_COUNT=$(find "$ROOT" -type f -not -path '*/__pycache__/*' | wc -l | tr -d ' ')
          echo "original source files=$SRC_COUNT staged=$DST_COUNT"
          test "$SRC_COUNT" = "$DST_COUNT"
          test ! -d "$ROOT/shared"

      - name: Verify active canonical shared references without copying them
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('staging/audyt-systemu-v4')
          shared = Path('Wersja rozwojowa rozpakowana/shared')
          pats = [
              re.compile(r'\bview\s+/mnt/skills/user/shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml|html))'),
              re.compile(r'\bview\s+shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml|html))'),
          ]
          refs = set()
          for f in root.rglob('*'):
              if not f.is_file() or f.suffix.lower() not in {'.md','.txt','.json','.py','.sh','.yaml','.yml','.html'}:
                  continue
              try:
                  data = f.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for pat in pats:
                  refs.update(m.group(1) for m in pat.finditer(data))
          refs = {r for r in refs if '<' not in r and '{' not in r and '[' not in r}
          missing = [r for r in sorted(refs) if not (shared / r).is_file()]
          if missing:
              raise SystemExit('Missing active canonical shared dependencies: ' + ', '.join(missing))
          print('Verified active external shared references:', len(refs))
          for r in sorted(refs):
              print('shared/' + r)
          PY

      - name: Add manifest and checksums; validate package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          root = Path('staging/audyt-systemu-v4')
          original_count = sum(1 for p in root.rglob('*') if p.is_file())
          text = (root/'SKILL.md').read_text(encoding='utf-8')
          m = re.search(r'^description:\s*(.*)$', text, re.M)
          if not m:
              raise SystemExit('description missing')
          desc = m.group(1).strip().strip('"').strip("'")
          if len(desc) > 200:
              raise SystemExit(f'description too long: {len(desc)}')

          manifest = [
              '# Portability manifest — audyt-systemu-v4','',
              '- Source repository: `michaleiatrak-star/Lex-Machina`',
              '- Portability branch: `portability/audyt-systemu-v4-01`',
              '- Source baseline: `bdebb4b0b6ba63add44501795c6e4acdc5bfd931`',
              f'- Complete skill files before manifest/checksums: **{original_count}**',
              f'- Frontmatter description length: **{len(desc)}/200**','',
              '## Zasada shared','',
              '`shared` pozostaje osobnym kanonicznym skillem. Ten ZIP nie zawiera kopii plików `shared`; build sprawdza aktywne wywołania zasobów shared, a nie historyczne wzmianki w dziennikach audytowych.','',
              '## Zmiany portability już zastosowane na gałęzi','',
              '- T14: profil wspólny Claude + ChatGPT dla `description`.',
              '- Root repo: wykrywany lub przekazywany jawnie; brak wymogu `/mnt/skills/user`.',
              '- `dostarcz_skill.sh`: jeden skill = jeden kompletny ZIP, twardy limit 200.',
              '- `run_regression_suite.py`: root propagowany do testów.',
              '- `ci_check_shared.py`: rozpoznaje legacy ścieżki i raportuje portability bez uzależniania od jednego hosta.','',
              '## Zasada nienaruszania instrukcji','',
              'Instrukcje, które są zrozumiałe i wykonalne przez ChatGPT i Claude, pozostają bez zmian; modyfikowana jest tylko rzeczywista warstwa zależna od runtime.',''
          ]
          (root/'PORTABILITY-MANIFEST.md').write_text('\n'.join(manifest), encoding='utf-8')

          rows = []
          for f in sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'CHECKSUMS.sha256'):
              rows.append(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.relative_to(root).as_posix()}')
          (root/'CHECKSUMS.sha256').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY

          ROOT='staging/audyt-systemu-v4'
          COUNT=$(find "$ROOT" -type f -not -path '*/__pycache__/*' | wc -l | tr -d ' ')
          echo "FINAL_FILES=$COUNT"
          if [ "$COUNT" -gt 200 ]; then
            echo "ERROR: final skill has $COUNT files; hard limit 200" >&2
            exit 1
          fi
          test -f "$ROOT/SKILL.md"
          test -f "$ROOT/README.md"
          test -d "$ROOT/modules"
          test -d "$ROOT/references"
          test -d "$ROOT/scripts"
          test -d "$ROOT/widgets"
          test ! -d "$ROOT/shared"
          python -m py_compile "$ROOT"/scripts/*.py
          bash -n "$ROOT/scripts/dostarcz_skill.sh"
          (cd "$ROOT" && sha256sum -c CHECKSUMS.sha256)

      - name: Upload one skill as one ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: audyt-systemu-v4
          path: staging
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
