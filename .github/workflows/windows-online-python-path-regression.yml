name: Windows Online Python Path Regression

on:
  pull_request:
    paths:
      - "app/installer/windows-online-bootstrap-entry.ps1"
      - "app/installer/windows-online-python-embedded.ps1"
      - "app/installer/windows-online-bootstrap.ps1"
      - "app/installer/windows-release-source.json"
      - "app/installer/build-windows-online.ps1"
      - "app/lex-desktop/src-tauri/windows/hooks.nsh"
      - "app/lex-runtime/src/validate-g33d.ts"
      - ".github/workflows/windows-online-python-path-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-target-path:
    name: Isolated private Python with spaces Unicode and installer residue
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exercise registry-independent production Python bootstrap
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "Lex Machina Łódź\runtime"
          Remove-Item (Split-Path -Parent $runtimeRoot) -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null
          Copy-Item "app\installer\windows-release-source.json" (Join-Path $runtimeRoot "release-source.json")

          $manifestPath = Join-Path $runtimeRoot "release-source.json"
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $manifest.runtime.python.url = "http://127.0.0.1:9/legacy-python-installer-must-not-be-used.exe"
          $manifest.runtime.python.sha256 = ("0" * 64)
          [IO.File]::WriteAllText(
            $manifestPath,
            ($manifest | ConvertTo-Json -Depth 12) + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )

          $registryRoot = "HKCU:\Software\Python\PythonCore\3.13"
          $createdRegistryResidue = -not (Test-Path -LiteralPath $registryRoot)
          if ($createdRegistryResidue) {
            New-Item -Path (Join-Path $registryRoot "InstallPath") -Force | Out-Null
            Set-Item -Path (Join-Path $registryRoot "InstallPath") -Value "C:\Broken Previous Python Registration"
          }

          try {
            & ".\app\installer\windows-online-bootstrap-entry.ps1" `
              -RuntimeRoot $runtimeRoot `
              -StopAfterPythonValidation
            if ($LASTEXITCODE -ne 0) { throw "REGRESSION_PRODUCTION_ENTRY_FAILED:$LASTEXITCODE" }

            $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
            $python = Join-Path $runtimeRoot "python\python.exe"
            if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
              throw "REGRESSION_PRIVATE_PYTHON_MISSING:$python"
            }

            $version = (& $python -X utf8 --version 2>&1 | Select-Object -First 1).ToString().Trim()
            $expected = "Python $($manifest.runtime.python.version)"
            if ($version -ne $expected) {
              throw "REGRESSION_PRIVATE_PYTHON_VERSION_INVALID expected=$expected actual=$version"
            }

            $pipVersion = (& $python -X utf8 -c "import importlib.metadata; print(importlib.metadata.version('pip'))" 2>&1 | Select-Object -First 1).ToString().Trim()
            $expectedPip = $manifest.runtime.python.pipBootstrap.version.ToString()
            if ($pipVersion -ne $expectedPip) {
              throw "REGRESSION_PRIVATE_PIP_VERSION_INVALID expected=$expectedPip actual=$pipVersion"
            }

            $isolation = (& $python -X utf8 -c "import site,sys; u=site.getusersitepackages(); print(str(sys.flags.isolated)+'|'+str(u in sys.path))").ToString().Trim()
            if ($isolation -ne "1|False") {
              throw "REGRESSION_PRIVATE_PYTHON_ISOLATION_INVALID:$isolation"
            }

            $pth = Get-ChildItem (Join-Path $runtimeRoot "python") -File -Filter "python*._pth" | Select-Object -First 1
            if (-not $pth) { throw "REGRESSION_PRIVATE_PYTHON_PTH_MISSING" }
            $pthText = Get-Content -Raw -LiteralPath $pth.FullName
            if ($pthText -notmatch [regex]::Escape("Lib\site-packages")) {
              throw "REGRESSION_PRIVATE_PYTHON_SITE_PACKAGES_PATH_MISSING"
            }

            & ".\app\installer\windows-online-bootstrap-entry.ps1" `
              -RuntimeRoot $runtimeRoot `
              -StopAfterPythonValidation
            if ($LASTEXITCODE -ne 0) { throw "REGRESSION_EMBEDDED_REUSE_FAILED:$LASTEXITCODE" }

            Write-Host "WINDOWS_ONLINE_PYTHON_ISOLATED_REGRESSION_PASS:$python"
          } finally {
            if ($createdRegistryResidue) {
              Remove-Item -LiteralPath $registryRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
