name: Lex Machina 0.1.3 RC1 Installer Release

on:
  push:
    branches:
      - "release/0.1.3-rc1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lex-release-0.1.3-rc1
  cancel-in-progress: false

jobs:
  online:
    uses: ./.github/workflows/lex-installer.yml

  offline:
    uses: ./.github/workflows/offline-windows-installer.yml
    with:
      signed: false

  publish:
    name: Publish unsigned installer prerelease
    needs:
      - online
      - offline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download online installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LexMachina-Windows-Online-Installer
          path: release-input/online

      - name: Download offline installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LexMachina-Windows-Offline-Setup
          path: release-input/offline

      - name: Assemble release assets and receipts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          online_src="$(find release-input/online -type f -name '*.exe' | head -n 1)"
          offline_src="$(find release-input/offline -type f -name 'LexMachina-Offline-Setup.exe' | head -n 1)"

          if [[ -z "${online_src}" || ! -f "${online_src}" ]]; then
            echo "ONLINE_RELEASE_ASSET_MISSING" >&2
            exit 1
          fi
          if [[ -z "${offline_src}" || ! -f "${offline_src}" ]]; then
            echo "OFFLINE_RELEASE_ASSET_MISSING" >&2
            exit 1
          fi

          cp "${online_src}" "release-assets/LexMachina-Online-Setup.exe"
          cp "${offline_src}" "release-assets/LexMachina-Offline-Setup.exe"

          online_sha="$(sha256sum release-assets/LexMachina-Online-Setup.exe | awk '{print $1}')"
          offline_sha="$(sha256sum release-assets/LexMachina-Offline-Setup.exe | awk '{print $1}')"
          online_bytes="$(stat -c '%s' release-assets/LexMachina-Online-Setup.exe)"
          offline_bytes="$(stat -c '%s' release-assets/LexMachina-Offline-Setup.exe)"

          cat > release-assets/SHA256-RELEASE.txt <<EOF
          version=0.1.3
          release_kind=UNSIGNED_PRERELEASE
          commit=${GITHUB_SHA}
          online_installer=LexMachina-Online-Setup.exe
          online_sha256=${online_sha}
          online_bytes=${online_bytes}
          offline_installer=LexMachina-Offline-Setup.exe
          offline_sha256=${offline_sha}
          offline_bytes=${offline_bytes}
          EOF

          cp app/installer/windows-release-source.json release-assets/windows-release-source.json
          cp G39-IMPLEMENTATION-STATUS-2026-09-18.md release-assets/G39-IMPLEMENTATION-STATUS-2026-09-18.md

          cat > release-assets/RELEASE-NOTES.md <<EOF
          # Lex Machina 0.1.3 RC1

          This is an **unsigned prerelease candidate**, not the stable production release.

          ## Installers

          - **Online**: `LexMachina-Online-Setup.exe` — installs the application runtime and required components; Local AI is optional and is downloaded only after installation when the user explicitly requests it.
          - **Standalone offline**: `LexMachina-Offline-Setup.exe` — contains the complete core runtime needed for an offline installation; Local AI model weights remain optional post-install components and are not embedded.

          ## Local AI

          The application can provision Bielik or Mistral-compatible local model packs after installation on explicit user request. The selected runtime context is configurable from 64,000 to 200,000 tokens within the model/runtime policy, and is accepted only after a real local startup/health validation. Extended context is explicitly reported as YaRN when it exceeds the model-native window.

          ## Update and installer behavior

          - installer distinguishes fresh install, upgrade, repair/current and blocked downgrade;
          - existing current-user install location is restored from the NSIS registry contract and a conflicting maintenance target is blocked;
          - application updates require SHA-256 plus a pinned Authenticode publisher and therefore remain fail-closed until the production certificate trust root is configured;
          - skill/model update channels use separate Ed25519 signed-index trust roots and remain fail-closed until production public keys are configured.

          ## Security status

          These RC1 EXEs are intentionally **not Authenticode-signed** because the production signing certificate has not been configured in the repository trust root. Do not treat this prerelease as the stable production channel.

          Exact SHA-256 values and sizes are in `SHA256-RELEASE.txt`.

          Source commit: `${GITHUB_SHA}`.
          EOF

          cat release-assets/SHA256-RELEASE.txt

      - name: Publish or update GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.1.3-rc1"
          title="Lex Machina 0.1.3 RC1 — unsigned installer candidate"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}"               --title "${title}"               --notes-file release-assets/RELEASE-NOTES.md               --prerelease
            gh release upload "${tag}"               release-assets/LexMachina-Online-Setup.exe               release-assets/LexMachina-Offline-Setup.exe               release-assets/SHA256-RELEASE.txt               release-assets/windows-release-source.json               release-assets/G39-IMPLEMENTATION-STATUS-2026-09-18.md               --clobber
          else
            gh release create "${tag}"               --target "${GITHUB_SHA}"               --title "${title}"               --notes-file release-assets/RELEASE-NOTES.md               --prerelease               release-assets/LexMachina-Online-Setup.exe               release-assets/LexMachina-Offline-Setup.exe               release-assets/SHA256-RELEASE.txt               release-assets/windows-release-source.json               release-assets/G39-IMPLEMENTATION-STATUS-2026-09-18.md
          fi
