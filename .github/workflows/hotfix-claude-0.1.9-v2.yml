name: Apply Claude account-session hotfix 0.1.9

on:
  push:
    branches:
      - "release/0.1.9"
    paths:
      - ".github/workflows/hotfix-claude-0.1.9-v2.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.7.0'

      - name: Apply hotfix
        run: python scripts/hotfix-claude-0.1.9.py

      - name: Install runtime dependencies
        working-directory: app/lex-runtime
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Runtime account-session tests
        working-directory: app/lex-runtime
        run: npx vitest run src/providers/account-session.test.ts

      - name: Runtime typecheck and build
        working-directory: app/lex-runtime
        run: |
          npm run typecheck
          npm run build

      - name: Commit tested hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/release-0.1.9.yml
          git commit -m "fix(claude): harden subscription account execution"
          git push origin HEAD:release/0.1.9
