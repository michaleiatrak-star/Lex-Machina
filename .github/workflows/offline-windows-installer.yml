name: Lex Machina Offline Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/installer/**"
      - "app/lex-desktop/**"
      - "app/lex-runtime/**"
      - "app/lex-web/**"
      - "app/ocr/**"
      - "app/privacy/**"
      - "app/storage/**"
      - "app/lex-version.yaml"
      - "Wersja rozwojowa rozpakowana/**"
      - ".github/workflows/offline-windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: offline-windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-offline-installer:
    name: Build and accept self-contained Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install runtime validation dependencies
        working-directory: app/lex-runtime
        run: npm install --no-audit --no-fund

      - name: Offline release contract
        working-directory: app/lex-runtime
        run: npm run validate:release-offline

      - name: Install web dependencies
        working-directory: app/lex-web
        run: npm install --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: app/lex-desktop
        run: npm install --no-audit --no-fund

      - name: Build complete offline private runtime payload
        shell: pwsh
        run: ./app/installer/build-windows-offline.ps1

      - name: Verify native G34G tests
        working-directory: app/lex-desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS offline installer
        working-directory: app/lex-desktop
        env:
          CI: "true"
        run: npx tauri build --bundles nsis --config src-tauri/tauri.offline.conf.json

      - name: Locate installer
        id: locate
        shell: pwsh
        run: |
          $installer = Get-ChildItem "app/lex-desktop/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS_OFFLINE_INSTALLER_NOT_FOUND" }
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($installer.FullName)"

      - name: Offline installed-copy acceptance
        shell: pwsh
        run: |
          ./app/installer/windows-installer-acceptance.ps1 `
            -InstallerPath "${{ steps.locate.outputs.installer }}" `
            -ExpectedNetworkRequiredAtInstall $false `
            -BlockNetworkDuringInstall

      - name: Record installer SHA-256
        shell: pwsh
        run: |
          $installer = "${{ steps.locate.outputs.installer }}"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          $shaFile = "app/lex-desktop/src-tauri/target/release/bundle/nsis/SHA256-OFFLINE.txt"
          "installer=$(Split-Path -Leaf $installer)" | Out-File -FilePath $shaFile -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "bytes=$((Get-Item -LiteralPath $installer).Length)" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          Get-Content $shaFile

      - name: Upload offline installer
        uses: actions/upload-artifact@v4
        with:
          name: LexMachina-Windows-Offline-Setup
          path: |
            app/lex-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/lex-desktop/src-tauri/target/release/bundle/nsis/SHA256-OFFLINE.txt
            app/lex-desktop/src-tauri/runtime/component-lock.json
          if-no-files-found: error
          retention-days: 14
