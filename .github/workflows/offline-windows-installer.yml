name: Lex Machina Offline Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/installer/**"
      - "app/lex-desktop/**"
      - "app/lex-runtime/**"
      - "app/lex-web/**"
      - "app/ocr/**"
      - "app/privacy/**"
      - "app/storage/**"
      - "app/lex-version.yaml"
      - "Wersja rozwojowa rozpakowana/**"
      - ".github/workflows/offline-windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: offline-windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-offline-installer:
    name: Build and accept standalone offline Windows EXE
    runs-on: windows-latest
    timeout-minutes: 210

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install runtime validation dependencies
        working-directory: app/lex-runtime
        run: npm install --no-audit --no-fund

      - name: Offline release contract
        working-directory: app/lex-runtime
        run: npm run validate:release-offline

      - name: Install web dependencies
        working-directory: app/lex-web
        run: npm install --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: app/lex-desktop
        run: npm install --no-audit --no-fund

      - name: Build complete offline private runtime payload
        shell: pwsh
        run: ./app/installer/build-windows-offline.ps1

      - name: Verify native G34G tests
        working-directory: app/lex-desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Stage external offline runtime bundle
        id: runtime_bundle
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:RUNNER_TEMP "lex-offline-bundle"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          $runtime = (Resolve-Path "app/lex-desktop/src-tauri/runtime").Path
          $bundle = Join-Path $bundleDir "LexMachina-Offline-Runtime.zip"
          Remove-Item -LiteralPath $bundle -Force -ErrorAction SilentlyContinue

          & tar.exe -a -c -f $bundle -C $runtime .
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
            throw "OFFLINE_RUNTIME_ARCHIVE_FAILED"
          }

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundle).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $bundle).Length
          Copy-Item -LiteralPath (Join-Path $runtime "component-lock.json") -Destination (Join-Path $bundleDir "component-lock-offline.json")

          "bundle=$bundle" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "bytes=$bytes" >> $env:GITHUB_OUTPUT
          Write-Host "Offline runtime bundle: $bundle ($bytes bytes, sha256=$hash)"

      - name: Rebuild thin installer payload
        shell: pwsh
        run: |
          $fullRuntime = (Resolve-Path "app/lex-desktop/src-tauri/runtime").Path
          $retiredRuntime = Join-Path $env:RUNNER_TEMP "lex-offline-runtime-built"

          Get-Process -ErrorAction SilentlyContinue | ForEach-Object {
            try {
              if ($_.Path -and $_.Path.StartsWith($fullRuntime, [StringComparison]::OrdinalIgnoreCase)) {
                Write-Host "Stopping generated-runtime process before thin rebuild: $($_.ProcessName) pid=$($_.Id) path=$($_.Path)"
                Stop-Process -Id $_.Id -Force -ErrorAction Stop
              }
            } catch {
              Write-Host "Process inspection/stop note: $($_.Exception.Message)"
            }
          }
          Start-Sleep -Seconds 2

          Remove-Item -LiteralPath $retiredRuntime -Recurse -Force -ErrorAction SilentlyContinue
          $moved = $false
          for ($attempt = 1; $attempt -le 10 -and -not $moved; $attempt++) {
            try {
              [IO.Directory]::Move($fullRuntime, $retiredRuntime)
              $moved = $true
            } catch {
              if ($attempt -eq 10) { throw }
              Write-Host "Runtime retirement attempt $attempt blocked by a transient handle; retrying."
              Start-Sleep -Seconds 2
            }
          }
          if (-not $moved -or (Test-Path -LiteralPath $fullRuntime)) {
            throw "OFFLINE_FULL_RUNTIME_RETIRE_FAILED"
          }

          ./app/installer/build-windows-online.ps1

          $receipt = [ordered]@{
            schemaVersion = 1
            bundleFile = "LexMachina-Offline-Runtime.zip"
            sha256 = "${{ steps.runtime_bundle.outputs.sha256 }}"
            bytes = [int64]"${{ steps.runtime_bundle.outputs.bytes }}"
          } | ConvertTo-Json -Depth 4

          [IO.File]::WriteAllText(
            (Join-Path (Resolve-Path "app/lex-desktop/src-tauri/runtime").Path "offline-runtime.json"),
            $receipt + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Build NSIS offline installer
        working-directory: app/lex-desktop
        env:
          CI: "true"
        run: npx tauri build --bundles nsis --config src-tauri/tauri.offline.conf.json

      - name: Assemble internal offline distribution
        id: locate
        shell: pwsh
        run: |
          $nsis = "app/lex-desktop/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem $nsis -Filter "*-setup.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS_OFFLINE_INSTALLER_NOT_FOUND" }

          $bundle = "${{ steps.runtime_bundle.outputs.bundle }}"
          $bundleDest = Join-Path $installer.Directory.FullName "LexMachina-Offline-Runtime.zip"
          Copy-Item -LiteralPath $bundle -Destination $bundleDest -Force
          $lockDest = Join-Path $installer.Directory.FullName "component-lock-offline.json"
          Copy-Item -LiteralPath (Join-Path (Split-Path $bundle) "component-lock-offline.json") -Destination $lockDest -Force

          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "bundle=$bundleDest" >> $env:GITHUB_OUTPUT
          "lock=$lockDest" >> $env:GITHUB_OUTPUT
          Write-Host "Internal installer: $($installer.FullName)"
          Write-Host "Runtime bundle: $bundleDest"

      - name: Build standalone offline EXE
        id: standalone
        shell: pwsh
        run: |
          $standaloneDir = "app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone"
          New-Item -ItemType Directory -Force -Path $standaloneDir | Out-Null
          $output = Join-Path $standaloneDir "LexMachina-Offline-Setup.exe"
          ./app/installer/build-offline-standalone.ps1 `
            -InstallerPath "${{ steps.locate.outputs.installer }}" `
            -RuntimeBundlePath "${{ steps.locate.outputs.bundle }}" `
            -ComponentLockPath "${{ steps.locate.outputs.lock }}" `
            -OutputPath $output

          $resolved = (Resolve-Path -LiteralPath $output).Path
          "installer=$resolved" >> $env:GITHUB_OUTPUT
          Write-Host "Standalone offline installer: $resolved"

      - name: Offline clean-machine standalone EXE acceptance
        shell: pwsh
        run: |
          ./app/installer/windows-installer-acceptance.ps1 `
            -InstallerPath "${{ steps.standalone.outputs.installer }}" `
            -ExpectedNetworkRequiredAtInstall $false `
            -BlockNetworkDuringInstall `
            -ForceVisualCppRuntimeInstall `
            -StandaloneOfflineExe `
            -InstallTimeoutSeconds 6000

      - name: Record standalone distribution SHA-256
        shell: pwsh
        run: |
          $standalone = "${{ steps.standalone.outputs.installer }}"
          $innerInstaller = "${{ steps.locate.outputs.installer }}"
          $bundle = "${{ steps.locate.outputs.bundle }}"
          $shaFile = "app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone/SHA256-OFFLINE.txt"

          $standaloneHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $standalone).Hash.ToLowerInvariant()
          $innerHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $innerInstaller).Hash.ToLowerInvariant()
          $bundleHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundle).Hash.ToLowerInvariant()

          "installer=LexMachina-Offline-Setup.exe" | Out-File -FilePath $shaFile -Encoding utf8
          "sha256=$standaloneHash" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "bytes=$((Get-Item -LiteralPath $standalone).Length)" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "inner_installer=$(Split-Path -Leaf $innerInstaller)" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "inner_installer_sha256=$innerHash" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "inner_installer_bytes=$((Get-Item -LiteralPath $innerInstaller).Length)" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "runtime_bundle=LexMachina-Offline-Runtime.zip" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "runtime_bundle_sha256=$bundleHash" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "runtime_bundle_bytes=$((Get-Item -LiteralPath $bundle).Length)" | Out-File -FilePath $shaFile -Encoding utf8 -Append

          if ($bundleHash -ne "${{ steps.runtime_bundle.outputs.sha256 }}") {
            throw "OFFLINE_RUNTIME_ARCHIVE_HASH_CHANGED"
          }
          Get-Content $shaFile

      - name: Copy offline component lock beside standalone receipt
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "${{ steps.locate.outputs.lock }}" `
            -Destination "app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone/component-lock-offline.json" -Force

      - name: Upload standalone offline EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LexMachina-Windows-Offline-Setup
          path: |
            app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone/LexMachina-Offline-Setup.exe
            app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone/SHA256-OFFLINE.txt
            app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone/component-lock-offline.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
