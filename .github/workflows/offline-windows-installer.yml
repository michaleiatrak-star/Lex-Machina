name: Lex Machina Offline Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/installer/**"
      - "app/lex-desktop/**"
      - "app/lex-runtime/**"
      - "app/lex-web/**"
      - "app/ocr/**"
      - "app/privacy/**"
      - "app/storage/**"
      - "app/lex-version.yaml"
      - "Wersja rozwojowa rozpakowana/**"
      - ".github/workflows/offline-windows-installer.yml"

permissions:
  contents: write

concurrency:
  group: offline-windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-offline-installer:
    name: Build and accept standalone offline Windows EXE
    runs-on: windows-latest
    timeout-minutes: 210

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install runtime validation dependencies
        working-directory: app/lex-runtime
        run: npm install --no-audit --no-fund

      - name: Offline release contract
        working-directory: app/lex-runtime
        run: npm run validate:release-offline

      - name: Install web dependencies
        working-directory: app/lex-web
        run: npm install --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: app/lex-desktop
        run: npm install --no-audit --no-fund

      - name: Build complete offline private runtime payload
        shell: pwsh
        run: ./app/installer/build-windows-offline.ps1

      - name: Verify native G34G tests
        working-directory: app/lex-desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Stage and verify external offline runtime bundle
        id: runtime_bundle
        shell: pwsh
        run: |
          $bundleDir = Join-Path $env:RUNNER_TEMP "lex-offline-bundle"
          $archiveSource = Join-Path $env:RUNNER_TEMP "lex-offline-archive-source"
          $verifyRoot = Join-Path $env:RUNNER_TEMP "lex-offline-archive-verify"
          foreach ($path in @($bundleDir, $archiveSource, $verifyRoot)) {
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }

          $runtime = (Resolve-Path "app/lex-desktop/src-tauri/runtime").Path
          $lockPath = Join-Path $runtime "component-lock.json"
          if (-not (Test-Path -LiteralPath $lockPath -PathType Leaf)) {
            throw "OFFLINE_RUNTIME_COMPONENT_LOCK_MISSING"
          }

          # Materialize a fresh copy before archiving. Some Python wheels contain
          # file/link metadata that can confuse bsdtar's self-archive detection.
          $null = robocopy.exe $runtime $archiveSource /E /COPY:DAT /DCOPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP
          $copyCode = $LASTEXITCODE
          if ($copyCode -gt 7) {
            throw "OFFLINE_ARCHIVE_SOURCE_COPY_FAILED:$copyCode"
          }

          $bundle = Join-Path $bundleDir "LexMachina-Offline-Runtime.zip"
          & tar.exe -a -c -f $bundle -C $archiveSource .
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
            throw "OFFLINE_RUNTIME_ARCHIVE_FAILED:$LASTEXITCODE"
          }

          # Fail closed before building the standalone wrapper: extract the exact
          # ZIP that will ship and verify every immutable component-lock entry.
          & tar.exe -xf $bundle -C $verifyRoot
          if ($LASTEXITCODE -ne 0) {
            throw "OFFLINE_RUNTIME_ARCHIVE_VERIFY_EXTRACT_FAILED:$LASTEXITCODE"
          }
          $lock = Get-Content -Raw -LiteralPath $lockPath | ConvertFrom-Json
          $verifiedCount = 0
          foreach ($entry in $lock.files) {
            $candidate = Join-Path $verifyRoot ($entry.path -replace '/','\')
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "OFFLINE_RUNTIME_ARCHIVE_LOCK_FILE_MISSING:$($entry.path)"
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidate).Hash.ToLowerInvariant()
            if ($actual -ne $entry.sha256.ToLowerInvariant()) {
              throw "OFFLINE_RUNTIME_ARCHIVE_LOCK_HASH_MISMATCH:$($entry.path)"
            }
            $verifiedCount++
          }
          if ($verifiedCount -ne @($lock.files).Count) {
            throw "OFFLINE_RUNTIME_ARCHIVE_VERIFY_COUNT_MISMATCH"
          }
          Write-Host "OFFLINE_RUNTIME_ARCHIVE_LOCK_PASS:$verifiedCount"

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundle).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $bundle).Length
          Copy-Item -LiteralPath $lockPath -Destination (Join-Path $bundleDir "component-lock-offline.json")

          "bundle=$bundle" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "bytes=$bytes" >> $env:GITHUB_OUTPUT
          Write-Host "Offline runtime bundle: $bundle ($bytes bytes, sha256=$hash)"

      - name: Rebuild thin installer payload
        shell: pwsh
        run: |
          $fullRuntime = (Resolve-Path "app/lex-desktop/src-tauri/runtime").Path
          $retiredRuntime = Join-Path $env:RUNNER_TEMP "lex-offline-runtime-built"

          Get-Process -ErrorAction SilentlyContinue | ForEach-Object {
            try {
              if ($_.Path -and $_.Path.StartsWith($fullRuntime, [StringComparison]::OrdinalIgnoreCase)) {
                Write-Host "Stopping generated-runtime process before thin rebuild: $($_.ProcessName) pid=$($_.Id) path=$($_.Path)"
                Stop-Process -Id $_.Id -Force -ErrorAction Stop
              }
            } catch {
              Write-Host "Process inspection/stop note: $($_.Exception.Message)"
            }
          }
          Start-Sleep -Seconds 2

          Remove-Item -LiteralPath $retiredRuntime -Recurse -Force -ErrorAction SilentlyContinue
          $moved = $false
          for ($attempt = 1; $attempt -le 10 -and -not $moved; $attempt++) {
            try {
              [IO.Directory]::Move($fullRuntime, $retiredRuntime)
              $moved = $true
            } catch {
              if ($attempt -eq 10) { throw }
              Write-Host "Runtime retirement attempt $attempt blocked by a transient handle; retrying."
              Start-Sleep -Seconds 2
            }
          }
          if (-not $moved -or (Test-Path -LiteralPath $fullRuntime)) {
            throw "OFFLINE_FULL_RUNTIME_RETIRE_FAILED"
          }

          ./app/installer/build-windows-online.ps1

          $receipt = [ordered]@{
            schemaVersion = 1
            bundleFile = "LexMachina-Offline-Runtime.zip"
            sha256 = "${{ steps.runtime_bundle.outputs.sha256 }}"
            bytes = [int64]"${{ steps.runtime_bundle.outputs.bytes }}"
          } | ConvertTo-Json -Depth 4

          [IO.File]::WriteAllText(
            (Join-Path (Resolve-Path "app/lex-desktop/src-tauri/runtime").Path "offline-runtime.json"),
            $receipt + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Build NSIS offline installer
        working-directory: app/lex-desktop
        env:
          CI: "true"
        run: npx tauri build --bundles nsis --config src-tauri/tauri.offline.conf.json

      - name: Assemble internal offline distribution
        id: locate
        shell: pwsh
        run: |
          $nsis = "app/lex-desktop/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem $nsis -Filter "*-setup.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS_OFFLINE_INSTALLER_NOT_FOUND" }

          $bundle = "${{ steps.runtime_bundle.outputs.bundle }}"
          $bundleDest = Join-Path $installer.Directory.FullName "LexMachina-Offline-Runtime.zip"
          Copy-Item -LiteralPath $bundle -Destination $bundleDest -Force
          $lockDest = Join-Path $installer.Directory.FullName "component-lock-offline.json"
          Copy-Item -LiteralPath (Join-Path (Split-Path $bundle) "component-lock-offline.json") -Destination $lockDest -Force

          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "bundle=$bundleDest" >> $env:GITHUB_OUTPUT
          "lock=$lockDest" >> $env:GITHUB_OUTPUT
          Write-Host "Internal installer: $($installer.FullName)"
          Write-Host "Runtime bundle: $bundleDest"

      - name: Build standalone offline EXE
        id: standalone
        shell: pwsh
        run: |
          $standaloneDir = "app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone"
          New-Item -ItemType Directory -Force -Path $standaloneDir | Out-Null
          $output = Join-Path $standaloneDir "LexMachina-Offline-Setup.exe"
          ./app/installer/build-offline-standalone.ps1 `
            -InstallerPath "${{ steps.locate.outputs.installer }}" `
            -RuntimeBundlePath "${{ steps.locate.outputs.bundle }}" `
            -ComponentLockPath "${{ steps.locate.outputs.lock }}" `
            -IconPath "app/lex-desktop/src-tauri/icons/icon.ico" `
            -OutputPath $output

          $resolved = (Resolve-Path -LiteralPath $output).Path
          "installer=$resolved" >> $env:GITHUB_OUTPUT
          Write-Host "Standalone offline installer: $resolved"

      - name: Offline clean-machine standalone EXE acceptance
        shell: pwsh
        run: |
          ./app/installer/windows-installer-acceptance.ps1 `
            -InstallerPath "${{ steps.standalone.outputs.installer }}" `
            -ExpectedNetworkRequiredAtInstall $false `
            -BlockNetworkDuringInstall `
            -ForceVisualCppRuntimeInstall `
            -StandaloneOfflineExe `
            -InstallTimeoutSeconds 6000

      - name: Record standalone distribution SHA-256
        shell: pwsh
        run: |
          $standalone = "${{ steps.standalone.outputs.installer }}"
          $innerInstaller = "${{ steps.locate.outputs.installer }}"
          $bundle = "${{ steps.locate.outputs.bundle }}"
          $shaFile = "app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone/SHA256-OFFLINE.txt"

          $standaloneHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $standalone).Hash.ToLowerInvariant()
          $innerHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $innerInstaller).Hash.ToLowerInvariant()
          $bundleHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundle).Hash.ToLowerInvariant()

          "installer=LexMachina-Offline-Setup.exe" | Out-File -FilePath $shaFile -Encoding utf8
          "sha256=$standaloneHash" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "bytes=$((Get-Item -LiteralPath $standalone).Length)" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "inner_installer=$(Split-Path -Leaf $innerInstaller)" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "inner_installer_sha256=$innerHash" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "inner_installer_bytes=$((Get-Item -LiteralPath $innerInstaller).Length)" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "runtime_bundle=LexMachina-Offline-Runtime.zip" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "runtime_bundle_sha256=$bundleHash" | Out-File -FilePath $shaFile -Encoding utf8 -Append
          "runtime_bundle_bytes=$((Get-Item -LiteralPath $bundle).Length)" | Out-File -FilePath $shaFile -Encoding utf8 -Append

          if ($bundleHash -ne "${{ steps.runtime_bundle.outputs.sha256 }}") {
            throw "OFFLINE_RUNTIME_ARCHIVE_HASH_CHANGED"
          }
          Get-Content $shaFile

      - name: Copy offline component lock beside standalone receipt
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "${{ steps.locate.outputs.lock }}" `
            -Destination "app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone/component-lock-offline.json" -Force

      - name: Upload standalone offline EXE
        uses: actions/upload-artifact@v4
        with:
          name: LexMachina-Windows-Offline-Setup
          path: |
            app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone/LexMachina-Offline-Setup.exe
            app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone/SHA256-OFFLINE.txt
            app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone/component-lock-offline.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish accepted offline hotfix and refresh v0.1.0
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/hotfix-offline-lock-icon-2026-09-17'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $headSha = "${{ github.event.pull_request.head.sha }}"
          $releaseDir = Join-Path $env:RUNNER_TEMP "lex-release-final"
          Remove-Item -LiteralPath $releaseDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $marker = Join-Path $releaseDir "ONLINE-HOTFIX-HEAD.txt"
          $onlineReady = $false
          for ($attempt = 1; $attempt -le 80; $attempt++) {
            Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
            gh release download v0.1.0 --pattern "ONLINE-HOTFIX-HEAD.txt" --dir $releaseDir --clobber --repo $repo 2>$null
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $marker -PathType Leaf)) {
              $publishedHead = (Get-Content -Raw -LiteralPath $marker).Trim()
              if ($publishedHead -eq $headSha) {
                $onlineReady = $true
                break
              }
              Write-Host "Online release marker is for $publishedHead; waiting for $headSha."
            } else {
              Write-Host "Online release marker not available yet; waiting."
            }
            Start-Sleep -Seconds 15
          }
          if (-not $onlineReady) {
            throw "RELEASE_ONLINE_ASSET_NOT_READY_FOR_HEAD:$headSha"
          }

          gh release download v0.1.0 --pattern "Lex-Machina-0.1.0-Online-x64-Setup.exe" --dir $releaseDir --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "RELEASE_ONLINE_DOWNLOAD_FAILED:$LASTEXITCODE" }
          $onlineInstaller = Join-Path $releaseDir "Lex-Machina-0.1.0-Online-x64-Setup.exe"
          if (-not (Test-Path -LiteralPath $onlineInstaller -PathType Leaf)) {
            throw "RELEASE_ONLINE_FILE_MISSING"
          }

          $offlineInstaller = Join-Path $releaseDir "Lex-Machina-0.1.0-Offline-x64-Setup.exe"
          Copy-Item -LiteralPath "${{ steps.standalone.outputs.installer }}" -Destination $offlineInstaller -Force
          $onlineHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $onlineInstaller).Hash.ToLowerInvariant()
          $offlineHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $offlineInstaller).Hash.ToLowerInvariant()

          $shaFile = Join-Path $releaseDir "SHA256SUMS.txt"
          [IO.File]::WriteAllLines($shaFile, @(
            "$onlineHash  Lex-Machina-0.1.0-Online-x64-Setup.exe",
            "$offlineHash  Lex-Machina-0.1.0-Offline-x64-Setup.exe"
          ), [Text.ASCIIEncoding]::new())

          $offlineReceipt = "app/lex-desktop/src-tauri/target/release/bundle/nsis/standalone/SHA256-OFFLINE.txt"
          $offlineHead = Join-Path $releaseDir "OFFLINE-HOTFIX-HEAD.txt"
          $headSha | Set-Content -LiteralPath $offlineHead -Encoding ascii

          gh release upload v0.1.0 $offlineInstaller $offlineReceipt $shaFile $offlineHead --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "RELEASE_OFFLINE_UPLOAD_FAILED:$LASTEXITCODE" }

          $notesFile = Join-Path $releaseDir "RELEASE-NOTES.md"
          $notes = @"
# Lex Machina v0.1.0

Windows x64 hotfix release with refreshed online and offline installers.

## Installer fixes

- Online bootstrap uses the accepted private-Python path/runtime fixes and is tested on paths containing spaces and Polish Unicode characters.
- Offline payload generation removes transient Python bytecode cache entries, rejects them from component locking, and uses shorter extraction staging paths to avoid Windows path-length failures.
- The Lex Machina application icon is explicitly used for the application EXE, NSIS installers and uninstaller; the standalone offline wrapper is compiled with the same icon. Installed shortcuts resolve to the branded application executable.

## Accepted hotfix source

`$headSha`

## Checksums

- Online SHA-256: `$onlineHash`
- Offline SHA-256: `$offlineHash`

`SHA256SUMS.txt` contains the canonical checksums for both published installers.
"@
          [IO.File]::WriteAllText($notesFile, $notes, [Text.UTF8Encoding]::new($false))
          gh release edit v0.1.0 --notes-file $notesFile --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "RELEASE_NOTES_UPDATE_FAILED:$LASTEXITCODE" }

          Write-Host "RELEASE_REFRESH_PASS head=$headSha online=$onlineHash offline=$offlineHash"
