name: Lex Runtime 24 Sep + Latest Development Skills

on:
  pull_request:
    branches:
      - "rebuild/0.1.10"
    paths:
      - ".github/workflows/release-runtime-2026-09-24-latest-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-2026-09-24-latest-skills-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-accept:
    name: Build accepted online installer with latest legal corpus
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout 24 Sep runtime head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Overlay latest development legal corpus from main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin main --depth=1
          $skillsSha = (git rev-parse FETCH_HEAD).Trim()
          Write-Host "Latest main legal-corpus source: $skillsSha"
          git checkout $skillsSha -- "WERSJA ROZWOJOWA" "Wersja rozwojowa rozpakowana"
          "runtime_head=${{ github.sha }}" | Out-File -FilePath "LATEST-SKILLS-BUILD-PROVENANCE.txt" -Encoding utf8
          "skills_source_branch=main" | Out-File -FilePath "LATEST-SKILLS-BUILD-PROVENANCE.txt" -Encoding utf8 -Append
          "skills_source_sha=$skillsSha" | Out-File -FilePath "LATEST-SKILLS-BUILD-PROVENANCE.txt" -Encoding utf8 -Append
          "build_date_utc=$(Get-Date -AsUTC -Format o)" | Out-File -FilePath "LATEST-SKILLS-BUILD-PROVENANCE.txt" -Encoding utf8 -Append

          python scripts/verify_development_archives.py
          if ($LASTEXITCODE -ne 0) { throw "DEVELOPMENT_ARCHIVES_VERIFY_FAILED" }

          $court = Get-Content -Raw "Wersja rozwojowa rozpakowana/analiza-sadowa-v6/SKILL.md"
          $router = Get-Content -Raw "Wersja rozwojowa rozpakowana/prawny-router-v3/SKILL.md"
          $polish = Get-Content -Raw "Wersja rozwojowa rozpakowana/prawo-polskie-v2/SKILL.md"
          if ($court -notmatch 'version:\s*"6\.10"') { throw "LATEST_ANALIZA_SADOWA_NOT_PRESENT" }
          if ($router -notmatch 'version:\s*"3\.50"') { throw "LATEST_PRAWNY_ROUTER_NOT_PRESENT" }
          if ($polish -notmatch 'version:\s*"6\.20"') { throw "LATEST_PRAWO_POLSKIE_NOT_PRESENT" }

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install runtime validation dependencies
        working-directory: app/lex-runtime
        run: npm install --no-audit --no-fund

      - name: Runtime release contract
        working-directory: app/lex-runtime
        run: npm run validate:g33d

      - name: Account-session and local runtime regressions
        working-directory: app/lex-runtime
        run: npx vitest run src/local-model-runtime-startup.test.ts src/providers/account-session.test.ts

      - name: Embedded Python hidden-stdio smoke test
        shell: pwsh
        run: ./app/installer/windows-embedded-python-smoke.ps1

      - name: Install web build dependencies
        working-directory: app/lex-web
        run: npm install --no-audit --no-fund

      - name: Install desktop build dependencies
        working-directory: app/lex-desktop
        run: npm install --no-audit --no-fund

      - name: Local primary model chat selection contract
        working-directory: app/lex-web
        run: npx vitest run src/MatterChatApp.primary-model.test.ts

      - name: Build thin online bootstrap payload
        shell: pwsh
        run: ./app/installer/build-windows-online.ps1

      - name: Build NSIS online installer
        working-directory: app/lex-desktop
        run: npx tauri build --bundles nsis

      - name: Windows branding acceptance
        shell: pwsh
        run: |
          $installer = Get-ChildItem "app\lex-desktop\src-tauri\target\release\bundle\nsis\*.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS_INSTALLER_NOT_FOUND_FOR_BRANDING" }
          ./app/installer/windows-branding-selftest.ps1 `
            -DesktopExePath "app/lex-desktop/src-tauri/target/release/lex-machina.exe" `
            -InstallerPath $installer.FullName

      - name: Provision VC++ prerequisite for unattended acceptance runner
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw "app/installer/windows-release-source.json" | ConvertFrom-Json
          $vc = $manifest.systemPrerequisites.visualCppRuntime
          if ($vc.sha256 -notmatch '^[a-fA-F0-9]{64}$') { throw "ACCEPTANCE_VC_HASH_INVALID" }
          $vcInstaller = Join-Path $env:RUNNER_TEMP "vc_redist.x64-$($vc.version).exe"
          Invoke-WebRequest -UseBasicParsing -Uri $vc.url -OutFile $vcInstaller
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $vcInstaller).Hash.ToLowerInvariant()
          if ($actual -ne $vc.sha256.ToLowerInvariant()) { throw "ACCEPTANCE_VC_HASH_MISMATCH" }
          $install = Start-Process -FilePath $vcInstaller -ArgumentList @("/install", "/quiet", "/norestart") -Wait -PassThru
          if ($install.ExitCode -notin @(0, 1638, 3010)) { throw "ACCEPTANCE_VC_INSTALL_FAILED:$($install.ExitCode)" }

      - name: Reproduce pre-existing same-version Python registration
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw "app/installer/windows-release-source.json" | ConvertFrom-Json
          $python = $manifest.runtime.python
          $foreignInstaller = Join-Path $env:RUNNER_TEMP "foreign-python-$($python.version)-amd64.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $python.url -OutFile $foreignInstaller
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $foreignInstaller).Hash.ToLowerInvariant()
          if ($actualHash -ne $python.sha256.ToLowerInvariant()) { throw "ACCEPTANCE_FOREIGN_PYTHON_HASH_MISMATCH" }
          $foreignRoot = Join-Path $env:RUNNER_TEMP ("Foreign Python " + $python.version)
          $foreignArgs = @(
            "/quiet",
            "InstallAllUsers=0",
            ('TargetDir="{0}"' -f $foreignRoot),
            "Include_launcher=0",
            "Include_test=0",
            "Include_doc=0",
            "Include_tcltk=0",
            "Include_tools=0",
            "Include_pip=0",
            "PrependPath=0",
            "Shortcuts=0"
          ) -join " "
          $proc = Start-Process -FilePath $foreignInstaller -ArgumentList $foreignArgs -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "ACCEPTANCE_FOREIGN_PYTHON_INSTALL_FAILED:$($proc.ExitCode)" }

      - name: Installed-copy online bootstrap acceptance
        shell: pwsh
        run: |
          $installer = Get-ChildItem "app\lex-desktop\src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS_INSTALLER_NOT_FOUND" }
          $installRoot = Join-Path $env:RUNNER_TEMP ("Lex Machina Michał LatestSkills-" + [Guid]::NewGuid().ToString("N"))
          ./app/installer/windows-installer-acceptance.ps1 `
            -InstallerPath $installer.FullName `
            -InstallRoot $installRoot

      - name: Record installer SHA-256 and provenance
        shell: pwsh
        run: |
          $installer = Get-ChildItem "app\lex-desktop\src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "installer=$($installer.Name)" | Out-File -FilePath "app\lex-desktop\src-tauri\target\release\bundle\nsis\SHA256.txt" -Encoding utf8
          "sha256=$hash" | Out-File -FilePath "app\lex-desktop\src-tauri\target\release\bundle\nsis\SHA256.txt" -Encoding utf8 -Append
          "bytes=$($installer.Length)" | Out-File -FilePath "app\lex-desktop\src-tauri\target\release\bundle\nsis\SHA256.txt" -Encoding utf8 -Append
          Get-Content "LATEST-SKILLS-BUILD-PROVENANCE.txt"
          Get-Content "app\lex-desktop\src-tauri\target\release\bundle\nsis\SHA256.txt"

      - name: Publish accepted installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LexMachina-Windows-Online-Installer-2026-09-24-LatestSkills
          path: |
            app/lex-desktop/src-tauri/target/release/bundle/nsis/*.exe
            app/lex-desktop/src-tauri/target/release/bundle/nsis/SHA256.txt
            app/lex-desktop/src-tauri/runtime/release-source.json
            app/lex-desktop/src-tauri/runtime/release-requirements.txt
            app/lex-desktop/src-tauri/runtime/npm-dependency-tree.json
            LATEST-SKILLS-BUILD-PROVENANCE.txt
          if-no-files-found: error
          retention-days: 14
