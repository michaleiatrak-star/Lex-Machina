name: F-138 structural audit

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - codex/f138-current-state-cleanup-2026-08-28
      - work/g39-installer-repair-2026-09-18
      - candidate/g39-online-fixed-2026-09-18

permissions:
  contents: read

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run F-138 structural checks
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/Wersja rozwojowa rozpakowana"

          python3 -m py_compile             "$ROOT/audyt-systemu-v4/scripts/check_rejestracja_modulow.py"             "$ROOT/audyt-systemu-v4/scripts/check_coverage_coherence.py"             "$ROOT/audyt-systemu-v4/scripts/test_moved_to_shared.py"             "$ROOT/audyt-systemu-v4/scripts/ci_check_shared.py"             "$ROOT/audyt-systemu-v4/scripts/test_f108_consistency.py"             "$ROOT/audyt-systemu-v4/scripts/run_regression_suite.py"

          python3 "$ROOT/audyt-systemu-v4/scripts/check_rejestracja_modulow.py" "$ROOT"
          python3 "$ROOT/audyt-systemu-v4/scripts/check_coverage_coherence.py" "$ROOT"
          python3 "$ROOT/audyt-systemu-v4/scripts/test_moved_to_shared.py" --repo-root "$ROOT"
          python3 "$ROOT/audyt-systemu-v4/scripts/ci_check_shared.py" --repo-root "$ROOT"
          python3 "$ROOT/audyt-systemu-v4/scripts/test_f108_consistency.py"
