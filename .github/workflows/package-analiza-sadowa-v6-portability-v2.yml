name: Package analiza-sadowa-v6 portability v2

on:
  push:
    branches:
      - portability/analiza-sadowa-v6-01
    paths:
      - '.github/workflows/package-analiza-sadowa-v6-portability-v2.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4

      - name: Stage and patch complete skill
        shell: bash
        run: |
          set -euo pipefail
          SRC='Wersja rozwojowa rozpakowana/analiza-sadowa-v6'
          rm -rf staging
          mkdir -p staging
          cp -a "$SRC" staging/analiza-sadowa-v6
          SRC_COUNT=$(find "$SRC" -type f | wc -l | tr -d ' ')
          DST_COUNT=$(find staging/analiza-sadowa-v6 -type f | wc -l | tr -d ' ')
          echo "original source files=$SRC_COUNT staged=$DST_COUNT"
          test "$SRC_COUNT" = "$DST_COUNT"
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('staging/analiza-sadowa-v6/SKILL.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('compatibility: "web_search, web_fetch, show_widget"','compatibility: "live_web_lookup, file_read, optional_interactive_ui"',1)
          pat = re.compile(r'description: \|\n(?:  .*\n)+?  v6: model CZTEROPRZEBIEGOWY z obowiązkową DWUKROTNĄ WERYFIKACJĄ dowodów i pism\.\n', re.M)
          repl = 'description: "Analiza akt i dokumentów prawnych: fakty, dowody, normy, orzecznictwo, terminy, koszty i szanse procesowe. Model 4-przebiegowy z dwukrotną weryfikacją; opcjonalny dashboard."\n'
          text, n = pat.subn(repl, text, count=1)
          if n != 1:
              raise SystemExit('description block not found exactly once')
          text = text.replace('Przed wpisaniem JAKIEJKOLWIEK normy do macierzy fakt-norma Claude MUSI:','Przed wpisaniem JAKIEJKOLWIEK normy do macierzy fakt-norma asystent MUSI:',1)
          adapter_lines = [
              '## ADAPTER RUNTIME — PORTABILITY (ChatGPT / Claude / inne hosty)',
              '',
              'Ta sekcja zmienia wyłącznie sposób wykonania operacji technicznych. Nie zmienia metodologii prawnej, hard gate\'ów, kolejności przejść ani kryteriów dowodowych tego skilla.',
              '',
              '1. Nazwy `view`, `web_search`, `web_fetch`, `show_widget`, `visualize:read_me` i `present_files` występujące w tym pliku lub w `references/` traktuj jako nazwy operacji semantycznych, a nie wymagane literalne nazwy narzędzi. Użyj równoważnej funkcji dostępnej w bieżącym hoście.',
              '2. `view /mnt/skills/user/analiza-sadowa-v6/...` oznacza odczyt odpowiedniego pliku lokalnego tego pakietu. Nie wymagaj istnienia literalnego katalogu `/mnt/skills`.',
              '3. `view /mnt/skills/user/shared/<plik>` oznacza odczyt kanonicznego zasobu shared. Rozwiązuj kolejno: dołączony `shared/<plik>`, sibling `../shared/<plik>` w repo, albo zasób bieżącego hosta.',
              '4. `view /mnt/user-data/uploads/{plik}` oznacza ponowne otwarcie rzeczywiście załączonego pliku przez mechanizm plików bieżącego hosta; nie zastępuj tego pamięcią kontekstu.',
              '5. `web_search` / `web_fetch` oznaczają świeże wyszukanie i odczyt źródła. Dla prawa i orzecznictwa zachowaj wymóg źródła urzędowego/oficjalnego i zakaz pracy z pamięci.',
              '6. `show_widget` / `visualize:read_me` oznaczają interaktywny widok, gdy host go obsługuje. Gdy nie obsługuje, użyj równoważnej ustrukturyzowanej odpowiedzi, HTML lub natywnego artefaktu hosta; brak React/JSX nie może blokować analizy merytorycznej.',
              '7. Odwołania do innych skilli są integracjami między-skillowymi, nie plikami tego skilla. Jeżeli integracja jest niedostępna, wykonaj część lokalną możliwą do wykonania i jawnie wskaż pominięty krok integracyjny — bez zmyślania wyniku.',
              '',
              '**Zasada nadrzędna adaptera:** jeżeli stara instrukcja jest wykonalna w bieżącym hoście bez konwersji, wykonaj ją wprost. Adapter działa tylko tam, gdzie literalna nazwa narzędzia lub ścieżka jest zależna od runtime.',
              '',
          ]
          adapter = '\n'.join(adapter_lines)
          marker = '---\n\n**Zasada progressive disclosure:**'
          if marker not in text:
              raise SystemExit('frontmatter closing marker not found')
          text = text.replace(marker, '---\n\n' + adapter + '**Zasada progressive disclosure:**', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Bundle recursive shared dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, shutil
          skill = Path('staging/analiza-sadowa-v6')
          shared_src = Path('Wersja rozwojowa rozpakowana/shared')
          shared_dst = skill / 'shared'
          shared_dst.mkdir(exist_ok=True)
          patterns = [
              re.compile(r'/mnt/skills/user/shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml))'),
              re.compile(r'(?<![A-Za-z0-9_.\-/])shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml))'),
          ]
          copied = set()
          changed = True
          while changed:
              changed = False
              refs = set()
              for f in [x for x in skill.rglob('*') if x.is_file() and x.suffix.lower() in {'.md','.txt','.json','.py','.sh','.yaml','.yml'}]:
                  try:
                      data = f.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for pat in patterns:
                      refs.update(m.group(1) for m in pat.finditer(data))
              for rel in sorted(refs):
                  src = shared_src / rel
                  dst = shared_dst / rel
                  if dst.exists():
                      continue
                  if not src.is_file():
                      raise SystemExit('Missing shared dependency: ' + rel)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  copied.add(rel)
                  changed = True
          print('Bundled shared dependency files:', len(copied))
          for rel in sorted(copied):
              print('shared/' + rel)
          PY

      - name: Manifest checksums and validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          root = Path('staging/analiza-sadowa-v6')
          source = Path('Wersja rozwojowa rozpakowana/analiza-sadowa-v6')
          original_count = sum(1 for p in source.rglob('*') if p.is_file())
          shared_files = sorted(p.relative_to(root).as_posix() for p in (root/'shared').rglob('*') if p.is_file())
          text = (root/'SKILL.md').read_text(encoding='utf-8')
          m = re.search(r'^description:\s*"(.*?)"\s*$', text, re.M)
          if not m:
              raise SystemExit('portable description not found')
          desc_len = len(m.group(1))
          if desc_len > 200:
              raise SystemExit(f'description too long: {desc_len}')
          lines = [
              '# Portability manifest — analiza-sadowa-v6','',
              '- Source repository: `michaleiatrak-star/Lex-Machina`',
              '- Source commit: `bdebb4b0b6ba63add44501795c6e4acdc5bfd931`',
              '- Original skill tree SHA: `4ae1d0bab70923a6ff960a2cf85038cb001b10f5`',
              f'- Original skill files copied before portability additions: **{original_count}**',
              f'- Bundled recursive `shared/` dependency files: **{len(shared_files)}**',
              f'- Frontmatter description length: **{desc_len}/200**','',
              '## Changes limited to runtime portability','',
              '1. Host-specific compatibility metadata made tool-name-neutral.',
              '2. Frontmatter description compacted; detailed triggers remain in the body.',
              '3. One `Claude MUSI` imperative changed to `asystent MUSI`.',
              '4. Added runtime adapter for legacy tool names and `/mnt/...` paths.',
              '5. Added local recursive `shared/` dependency closure for standalone ZIP use.',
              '6. Legal methodology, gates, scoring, report schema, filters and specialist modules were not rewritten.','',
              '## Bundled shared files','',
          ]
          lines += [f'- `{x}`' for x in shared_files]
          lines += ['', '## External integrations intentionally not vendored','', 'Other named skills remain separate skills. If unavailable, the adapter requires graceful local fallback without fabricated results.','']
          (root/'PORTABILITY-MANIFEST.md').write_text('\n'.join(lines), encoding='utf-8')
          rows=[]
          for f in sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'CHECKSUMS.sha256'):
              rows.append(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.relative_to(root).as_posix()}')
          (root/'CHECKSUMS.sha256').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY
          ROOT='staging/analiza-sadowa-v6'
          COUNT=$(find "$ROOT" -type f | wc -l | tr -d ' ')
          echo "FINAL_FILES=$COUNT"
          if [ "$COUNT" -gt 200 ]; then echo "ERROR: final skill has $COUNT files" >&2; exit 1; fi
          test -f "$ROOT/SKILL.md"
          test -d "$ROOT/references"
          test -d "$ROOT/shared"
          grep -q '^## ADAPTER RUNTIME — PORTABILITY' "$ROOT/SKILL.md"
          ! grep -q 'fakt-norma Claude MUSI' "$ROOT/SKILL.md"
          (cd "$ROOT" && sha256sum -c CHECKSUMS.sha256)

      - name: Upload one skill as one ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: analiza-sadowa-v6
          path: staging
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
