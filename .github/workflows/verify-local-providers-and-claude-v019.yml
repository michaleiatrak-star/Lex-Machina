name: Verify local providers and Claude v0.1.9

on:
  push:
    branches:
      - "fix/local-providers-from-v0.1.9"
    paths:
      - ".github/workflows/verify-local-providers-and-claude-v019.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.7.0'

      - name: Regression tests for local startup and Claude account session
        working-directory: app/lex-runtime
        run: |
          ./node_modules/.bin/vitest run src/local-model-runtime-startup.test.ts src/providers/account-session.test.ts

      - name: Start deterministic OpenAI-compatible localhost fixture
        shell: bash
        run: |
          cat >/tmp/lex-local-smoke-fixture.mjs <<'EOF'
          import http from 'node:http';
          const models = [
            'local/mistral-nemo-12b-q4km',
            'local/bielik-11b-v3-q4km'
          ];
          const server = http.createServer(async (req, res) => {
            res.setHeader('content-type', 'application/json');
            if (req.method === 'GET' && req.url === '/v1/models') {
              res.end(JSON.stringify({object:'list', data: models.map(id => ({id, object:'model'}))}));
              return;
            }
            if (req.method === 'POST' && req.url === '/v1/chat/completions') {
              let body = '';
              for await (const chunk of req) body += chunk;
              const parsed = JSON.parse(body || '{}');
              if (!models.includes(parsed.model)) {
                res.statusCode = 404;
                res.end(JSON.stringify({error:{message:'unknown model'}}));
                return;
              }
              res.end(JSON.stringify({
                id:'fixture', object:'chat.completion',
                choices:[{index:0,message:{role:'assistant',content:'OK'},finish_reason:'stop'}]
              }));
              return;
            }
            res.statusCode = 404;
            res.end(JSON.stringify({error:{message:'not found'}}));
          });
          server.listen(4318, '127.0.0.1', () => console.log('fixture ready'));
          EOF
          node /tmp/lex-local-smoke-fixture.mjs >/tmp/lex-fixture.log 2>&1 &
          echo $! >/tmp/lex-fixture.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4318/v1/models >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/lex-fixture.log
          exit 1

      - name: Mistral localhost smoke
        env:
          LEX_LOCAL_MODEL_ID: local/mistral-nemo-12b-q4km
          LEX_LOCAL_LLM_ENDPOINT: http://127.0.0.1:4318/v1
        run: node scripts/local-provider-smoke.mjs

      - name: Bielik localhost smoke
        env:
          LEX_LOCAL_MODEL_ID: local/bielik-11b-v3-q4km
          LEX_LOCAL_LLM_ENDPOINT: http://127.0.0.1:4318/v1
        run: node scripts/local-provider-smoke.mjs

      - name: Cleanup workflow after successful verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/verify-local-providers-and-claude-v019.yml
          git add .github/workflows/verify-local-providers-and-claude-v019.yml
          git commit -m "ci: remove temporary provider verification workflow"
          git push origin HEAD:fix/local-providers-from-v0.1.9
