name: Fix local provider startup from v0.1.9

on:
  push:
    branches:
      - "fix/local-providers-from-v0.1.9"
    paths:
      - ".github/workflows/fix-local-providers-v019.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.7.0'
          cache: npm
          cache-dependency-path: app/lex-runtime/package-lock.json

      - name: Make native local-agent assets optional
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path('app/lex-runtime/src/local-model-runtime.ts')
          source = runtime.read_text(encoding='utf-8')

          normalize_marker = '''function normalizeModelId(id: string): string {
            return LEGACY_MODEL_ALIASES[id] ?? id;
          }

          '''
          helper = '''export type OptionalLocalLaunchSpec = {
            args: string[];
            env: NodeJS.ProcessEnv;
          };

          /**
           * Native llama.cpp agent configuration and grounded templates are
           * enhancements, not prerequisites for local inference. Existing
           * v0.1.9 installations must remain startable without re-provisioning.
           */
          export function buildOptionalLocalLaunchSpec(
            rootDir: string,
            modelId: string,
            baseArgs: readonly string[],
            baseEnv: NodeJS.ProcessEnv = process.env
          ): OptionalLocalLaunchSpec {
            const canonical =
              normalizeModelId(modelId);
            const args = [...baseArgs];
            const env = { ...baseEnv };
            const mcpConfigPath =
              path.join(
                rootDir,
                "mcp-servers.json"
              );
            const uiConfigPath =
              path.join(
                rootDir,
                "llama-ui-config.json"
              );

            if (
              fs.existsSync(mcpConfigPath) &&
              fs.existsSync(uiConfigPath)
            ) {
              env.LLAMA_ARG_AGENT = "true";
              env.LLAMA_ARG_CORS_ORIGINS =
                "localhost";
              env.LLAMA_ARG_MCP_SERVERS_CONFIG =
                mcpConfigPath;
              env.LLAMA_ARG_UI_CONFIG_FILE =
                uiConfigPath;
            } else {
              // Do not inherit a partially configured native-agent setup from
              // the parent process: missing files must never block localhost.
              delete env.LLAMA_ARG_AGENT;
              delete env.LLAMA_ARG_MCP_SERVERS_CONFIG;
              delete env.LLAMA_ARG_UI_CONFIG_FILE;
            }

            const groundedTemplatePath =
              canonical ===
                "local/mistral-nemo-12b-q4km"
                ? path.join(
                    rootDir,
                    "mistral-nemo-web-grounded.jinja"
                  )
                : canonical ===
                    "local/bielik-11b-v3-q4km"
                  ? path.join(
                      rootDir,
                      "bielik-web-grounded.jinja"
                    )
                  : null;

            if (
              groundedTemplatePath &&
              fs.existsSync(
                groundedTemplatePath
              )
            ) {
              args.push(
                "--chat-template-file",
                groundedTemplatePath,
                "--temp",
                "0.3"
              );
            }

            return { args, env };
          }

          '''

          if 'buildOptionalLocalLaunchSpec' not in source:
              if normalize_marker not in source:
                  raise SystemExit('normalizeModelId marker not found')
              source = source.replace(
                  normalize_marker,
                  normalize_marker + helper,
                  1
              )

          old_spawn = '''    const child = spawn(config.engine.executable, args, {
                cwd: this.rootDir,
                windowsHide: true,
                stdio: ["ignore", "pipe", "pipe"]
              });'''
          new_spawn = '''    const launchSpec =
                buildOptionalLocalLaunchSpec(
                  this.rootDir,
                  canonical,
                  args,
                  process.env
                );
              const child = spawn(
                config.engine.executable,
                launchSpec.args,
                {
                  cwd: this.rootDir,
                  windowsHide: true,
                  stdio: ["ignore", "pipe", "pipe"],
                  env: launchSpec.env
                }
              );'''
          if old_spawn not in source:
              raise SystemExit('local llama spawn marker not found')
          source = source.replace(old_spawn, new_spawn, 1)
          runtime.write_text(source, encoding='utf-8')

          test = Path('app/lex-runtime/src/local-model-runtime-startup.test.ts')
          test.write_text(r'''import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import {
            afterEach,
            describe,
            expect,
            it
          } from "vitest";
          import {
            buildOptionalLocalLaunchSpec
          } from "./local-model-runtime.js";

          const roots: string[] = [];

          function temporaryRoot(): string {
            const root =
              fs.mkdtempSync(
                path.join(
                  os.tmpdir(),
                  "lex-local-startup-"
                )
              );
            roots.push(root);
            return root;
          }

          afterEach(() => {
            for (const root of roots.splice(0)) {
              fs.rmSync(
                root,
                {
                  recursive: true,
                  force: true
                }
              );
            }
          });

          describe(
            "local llama.cpp startup optional assets",
            () => {
              for (
                const modelId
                of [
                  "local/mistral-nemo-12b-q4km",
                  "local/bielik-11b-v3-q4km"
                ]
              ) {
                it(
                  `does not gate ${modelId} startup when MCP, UI and template files are absent`,
                  () => {
                    const root =
                      temporaryRoot();
                    const baseArgs = [
                      "--model",
                      "model.gguf",
                      "--port",
                      "4318"
                    ];
                    const result =
                      buildOptionalLocalLaunchSpec(
                        root,
                        modelId,
                        baseArgs,
                        {
                          LLAMA_ARG_AGENT:
                            "true",
                          LLAMA_ARG_MCP_SERVERS_CONFIG:
                            path.join(
                              root,
                              "missing-mcp.json"
                            ),
                          LLAMA_ARG_UI_CONFIG_FILE:
                            path.join(
                              root,
                              "missing-ui.json"
                            )
                        }
                      );

                    expect(result.args)
                      .toEqual(baseArgs);
                    expect(
                      result.env
                        .LLAMA_ARG_AGENT
                    ).toBeUndefined();
                    expect(
                      result.env
                        .LLAMA_ARG_MCP_SERVERS_CONFIG
                    ).toBeUndefined();
                    expect(
                      result.env
                        .LLAMA_ARG_UI_CONFIG_FILE
                    ).toBeUndefined();
                  }
                );
              }

              it(
                "uses native-agent configuration and a grounded template when all optional assets exist",
                () => {
                  const root =
                    temporaryRoot();
                  const mcp =
                    path.join(
                      root,
                      "mcp-servers.json"
                    );
                  const ui =
                    path.join(
                      root,
                      "llama-ui-config.json"
                    );
                  const template =
                    path.join(
                      root,
                      "mistral-nemo-web-grounded.jinja"
                    );
                  fs.writeFileSync(
                    mcp,
                    "{}\n"
                  );
                  fs.writeFileSync(
                    ui,
                    "{}\n"
                  );
                  fs.writeFileSync(
                    template,
                    "{{ messages }}\n"
                  );

                  const result =
                    buildOptionalLocalLaunchSpec(
                      root,
                      "local/mistral-nemo-12b-q4km",
                      ["--model", "model.gguf"],
                      {}
                    );

                  expect(
                    result.env
                      .LLAMA_ARG_AGENT
                  ).toBe("true");
                  expect(
                    result.env
                      .LLAMA_ARG_MCP_SERVERS_CONFIG
                  ).toBe(mcp);
                  expect(
                    result.env
                      .LLAMA_ARG_UI_CONFIG_FILE
                  ).toBe(ui);
                  expect(result.args)
                    .toContain(
                      "--chat-template-file"
                    );
                  expect(result.args)
                    .toContain(template);
                }
              );
            }
          );
          ''', encoding='utf-8')
          PY

      - name: Install runtime dependencies
        working-directory: app/lex-runtime
        run: npm ci

      - name: Local startup regression
        working-directory: app/lex-runtime
        run: npx vitest run src/local-model-runtime-startup.test.ts

      - name: Runtime typecheck and build
        working-directory: app/lex-runtime
        run: |
          npm run typecheck
          npm run build

      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-local-providers-v019.yml
          git add -A app/lex-runtime/src/local-model-runtime.ts \
            app/lex-runtime/src/local-model-runtime-startup.test.ts \
            .github/workflows/fix-local-providers-v019.yml
          git commit -m "fix(local-ai): keep localhost startup independent of optional agent assets"
          git push origin HEAD:fix/local-providers-from-v0.1.9
