name: Package analizator-umow-v1 portability

on:
  push:
    branches:
      - portability/analizator-umow-v1-01
    paths:
      - '.github/workflows/package-analizator-umow-v1-portability.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4

      - name: Stage complete skill and minimally adapt runtime layer
        shell: bash
        run: |
          set -euo pipefail
          SRC='Wersja rozwojowa rozpakowana/analizator-umow-v1'
          ROOT='staging/analizator-umow-v1'
          rm -rf staging
          mkdir -p staging
          cp -a "$SRC" "$ROOT"
          SRC_COUNT=$(find "$SRC" -type f | wc -l | tr -d ' ')
          DST_COUNT=$(find "$ROOT" -type f | wc -l | tr -d ' ')
          echo "original source files=$SRC_COUNT staged=$DST_COUNT"
          test "$SRC_COUNT" = "$DST_COUNT"
          test ! -d "$ROOT/shared"

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('staging/analizator-umow-v1/SKILL.md')
          text = p.read_text(encoding='utf-8')

          # Only metadata that hard-codes the Claude filesystem is normalized.
          compat = re.compile(r'compatibility:\n  tools:\n    - official_sources_only\n  shared_library: /mnt/skills/user/shared/\n')
          text, n = compat.subn(
              'compatibility: "Requires current official legal sources and access to the separately installed canonical shared skill; document generation is optional."\n',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('compatibility block not found exactly once')

          desc = re.compile(r'description: \|\n(?:  .*\n)+?(?=compatibility:)', re.M)
          replacement = ('description: "Analiza, redakcja, negocjacje i generowanie umów oraz dokumentów korporacyjnych, HR i RODO: ryzyka klauzul, B2B/B2C, praca, najem, IT/SaaS, IP, founders, finansowanie i PZP."\n')
          text, n = desc.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('description block not found exactly once')

          adapter = [
              '## ADAPTER RUNTIME — PORTABILITY (ChatGPT / Claude / inne hosty)',
              '',
              'Ta sekcja zmienia wyłącznie sposób wykonania operacji technicznych. Nie zmienia metodologii analizy umów, scoringu ryzyka, routingów J/G/H/I/K, hard gate’ów, checklist ani wymogów finalizacji.',
              '',
              '1. `view`, `web_search`, `web_fetch`, `present_files`, `create_file`, `bash`, `python` i podobne nazwy traktuj jako nazwy operacji semantycznych, jeżeli bieżący host nie udostępnia literalnie narzędzia o tej nazwie. Użyj równoważnej funkcji hosta.',
              '2. `view /mnt/skills/user/analizator-umow-v1/...` oraz `view references/...` oznaczają świeży odczyt odpowiedniego pliku lokalnego tego skilla (`references/`, `workflows/`). Nie wymagaj literalnego katalogu `/mnt/skills`.',
              '3. `view /mnt/skills/user/shared/<plik>` oznacza świeży odczyt z osobnego, kanonicznego skilla `shared`. NIE kopiuj `shared` do tej paczki. Jeżeli obowiązkowy zasób shared jest niedostępny, zastosuj fail-closed zamiast zastępować go pamięcią modelu.',
              '4. `web_search` / `web_fetch` oznaczają świeże wyszukanie i odczyt źródła. Dla prawa, orzecznictwa, UOKiK, EUR-Lex, NBP i innych danych regulacyjnych zachowaj istniejący wymóg źródła oficjalnego i zakaz cytowania z pamięci.',
              '5. `present_files` / `create_file` oznaczają utworzenie i przekazanie użytkownikowi dokumentu przez natywną funkcję plikową/dokumentową bieżącego hosta. Brak literalnej funkcji `present_files` nie zwalnia z bramek AU-HYBRID/AU-STRIP/AU-POST/AU-DISC i ST-GATE-FINAL.',
              '6. Ścieżki `/mnt/user-data/...` oznaczają rzeczywiste pliki użytkownika dostępne w bieżącym hoście. Wymagany ponowny odczyt dokumentu ma być rzeczywistym odczytem pliku, nie przypomnieniem z kontekstu.',
              '7. Polecenia shell/Python i narzędzia dokumentowe są technikami pomocniczymi, gdy host je udostępnia. Jeżeli nie, użyj natywnego parsera/generatora dokumentów, zachowując te same kryteria kompletności i walidacji.',
              '8. Odwołania do innych skilli są integracjami między-skillowymi. Nie kopiuj ich do tego ZIP-a. Jeśli integracja nie jest dostępna, wykonaj lokalną część możliwą do wykonania i jawnie oznacz pominięty krok bez tworzenia fikcyjnego wyniku.',
              '',
              '**Zasada nadrzędna adaptera:** jeśli istniejąca instrukcja jest zrozumiała i wykonalna przez bieżący host, wykonaj ją bez konwersji. Adapter działa tylko na rzeczywistej granicy runtime.',
              '',
          ]
          marker = '---\n# Skill: Analizator Umów i Porozumień v1'
          if marker not in text:
              raise SystemExit('frontmatter closing marker not found')
          text = text.replace(marker, '---\n\n' + '\n'.join(adapter) + '# Skill: Analizator Umów i Porozumień v1', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify active external shared and local references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('staging/analizator-umow-v1')
          shared = Path('Wersja rozwojowa rozpakowana/shared')
          skill_text = (root/'SKILL.md').read_text(encoding='utf-8')

          shared_pats = [
              re.compile(r'\bview\s+/mnt/skills/user/shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml|html))'),
              re.compile(r'\bview\s+shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml|html))'),
          ]
          srefs=set()
          for pat in shared_pats:
              srefs.update(m.group(1) for m in pat.finditer(skill_text))
          missing=[r for r in sorted(srefs) if not (shared/r).is_file()]
          if missing:
              raise SystemExit('Missing canonical shared dependencies: '+', '.join(missing))
          print('Verified active shared references:', len(srefs))

          local_pats = [
              re.compile(r'\bview\s+(references/[A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml|html))'),
              re.compile(r'\bview\s+/mnt/skills/user/analizator-umow-v1/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml|html))'),
          ]
          lrefs=set()
          for pat in local_pats:
              lrefs.update(m.group(1) for m in pat.finditer(skill_text))
          missing_local=[r for r in sorted(lrefs) if not (root/r).is_file()]
          if missing_local:
              raise SystemExit('Missing local skill dependencies: '+', '.join(missing_local))
          print('Verified local references:', len(lrefs))
          PY

      - name: Manifest checksums and validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          root=Path('staging/analizator-umow-v1')
          source=Path('Wersja rozwojowa rozpakowana/analizator-umow-v1')
          original_count=sum(1 for p in source.rglob('*') if p.is_file())
          text=(root/'SKILL.md').read_text(encoding='utf-8')
          m=re.search(r'^description:\s*"(.*?)"\s*$', text, re.M)
          if not m: raise SystemExit('portable description not found')
          desc_len=len(m.group(1))
          if desc_len>200: raise SystemExit(f'description too long: {desc_len}')
          manifest=[
              '# Portability manifest — analizator-umow-v1','',
              '- Source repository: `michaleiatrak-star/Lex-Machina`',
              '- Source commit: `bdebb4b0b6ba63add44501795c6e4acdc5bfd931`',
              '- Original SKILL.md blob: `2160050c58f0733b7dcaa9c44fc494f72cd3ac7e`',
              f'- Original skill files copied before portability additions: **{original_count}**',
              f'- Frontmatter description length: **{desc_len}/200**','',
              '## Zasada shared','',
              '`shared` pozostaje osobnym kanonicznym skillem. Ten ZIP nie zawiera kopii plików `shared`; build sprawdza aktywne odwołania do kanonicznych zasobów.','',
              '## Zmiany wyłącznie runtime portability','',
              '1. Usunięte z metadanych twarde wskazanie `/mnt/skills/user/shared/`.',
              '2. Skrócony tylko frontmatter `description`; szczegółowe triggery pozostają w treści.',
              '3. Dodany adapter dla legacy nazw narzędzi, ścieżek `/mnt/...` i dostarczania dokumentów.',
              '4. Routing umów, moduły references/workflows, hard gate’y, step tracker, redakcja i walidacja dokumentów nie zostały przepisane.',
              '5. Inne skille i `shared` pozostają odrębne.','',
              '## Zasada nienaruszania instrukcji','',
              'Instrukcje zrozumiałe i wykonalne przez host pozostają bez zmian; adapter działa tylko na granicy runtime.',''
          ]
          (root/'PORTABILITY-MANIFEST.md').write_text('\n'.join(manifest),encoding='utf-8')
          rows=[]
          for f in sorted(p for p in root.rglob('*') if p.is_file() and p.name!='CHECKSUMS.sha256'):
              rows.append(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.relative_to(root).as_posix()}')
          (root/'CHECKSUMS.sha256').write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY

          ROOT='staging/analizator-umow-v1'
          COUNT=$(find "$ROOT" -type f | wc -l | tr -d ' ')
          echo "FINAL_FILES=$COUNT"
          if [ "$COUNT" -gt 200 ]; then echo "ERROR: final skill has $COUNT files; hard limit 200" >&2; exit 1; fi
          test -f "$ROOT/SKILL.md"
          test -d "$ROOT/references"
          test -d "$ROOT/workflows"
          test ! -d "$ROOT/shared"
          grep -q '^## ADAPTER RUNTIME — PORTABILITY' "$ROOT/SKILL.md"
          (cd "$ROOT" && sha256sum -c CHECKSUMS.sha256)

      - name: Upload one skill as one ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: analizator-umow-v1
          path: staging
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
