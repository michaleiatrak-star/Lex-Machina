name: Package shared portability

on:
  push:
    branches:
      - portability/shared-01
    paths:
      - '.github/workflows/package-shared-portability.yml'
      - '.github/portability/package_shared_v2.py'
      - '.github/portability/shared-extract-api-verification-log.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate complete shared skill
        run: python .github/portability/package_shared_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: shared
          path: staging
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
