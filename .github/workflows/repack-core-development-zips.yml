name: Repack core development ZIPs
# retry-marker: 2026-09-14T18:55+02:00

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Wersja rozwojowa rozpakowana/shared/**"
      - "Wersja rozwojowa rozpakowana/orzeczenia-sadowe-v2/**"
      - "Wersja rozwojowa rozpakowana/audyt-systemu-v4/**"
      - ".github/workflows/repack-core-development-zips.yml"

permissions:
  contents: write

jobs:
  repack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checksums and rebuild complete archives
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          source_root = Path("Wersja rozwojowa rozpakowana")
          target_root = Path("WERSJA ROZWOJOWA")
          skills = [
              "shared",
              "orzeczenia-sadowe-v2",
              "audyt-systemu-v4",
          ]

          FIXED_DT = (1980, 1, 1, 0, 0, 0)

          def parse_checksums(skill_dir: Path) -> dict[str, str]:
              checksum_file = skill_dir / "CHECKSUMS.sha256"
              if not checksum_file.is_file():
                  raise SystemExit(f"Brak {checksum_file}")
              result: dict[str, str] = {}
              for raw in checksum_file.read_text(encoding="utf-8").splitlines():
                  raw = raw.strip()
                  if not raw:
                      continue
                  try:
                      digest, rel = raw.split(None, 1)
                  except ValueError as exc:
                      raise SystemExit(f"Błędna linia checksum: {raw!r}") from exc
                  rel = rel.strip()
                  if rel.startswith("./"):
                      rel = rel[2:]
                  result[rel] = digest.lower()
              return result

          def verify_skill(skill_dir: Path) -> list[Path]:
              files = sorted(p for p in skill_dir.rglob("*") if p.is_file())
              payload = [
                  p for p in files
                  if p.relative_to(skill_dir).as_posix() != "CHECKSUMS.sha256"
              ]
              expected = parse_checksums(skill_dir)
              actual_names = {p.relative_to(skill_dir).as_posix() for p in payload}
              expected_names = set(expected)

              missing = sorted(actual_names - expected_names)
              stale = sorted(expected_names - actual_names)
              if missing or stale:
                  raise SystemExit(
                      f"{skill_dir.name}: niespójny manifest checksum; "
                      f"brak wpisów={missing}, martwe wpisy={stale}"
                  )

              for p in payload:
                  rel = p.relative_to(skill_dir).as_posix()
                  actual = hashlib.sha256(p.read_bytes()).hexdigest()
                  if actual != expected[rel]:
                      raise SystemExit(
                          f"{skill_dir.name}: SHA-256 mismatch {rel}: "
                          f"{actual} != {expected[rel]}"
                      )
              return files

          def build_zip(skill_dir: Path, files: list[Path], out: Path) -> None:
              out.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(
                  out,
                  "w",
                  compression=zipfile.ZIP_DEFLATED,
                  compresslevel=9,
              ) as zf:
                  for p in files:
                      rel = p.relative_to(skill_dir)
                      arcname = (Path(skill_dir.name) / rel).as_posix()
                      info = zipfile.ZipInfo(arcname, date_time=FIXED_DT)
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = 0o100644 << 16
                      info.flag_bits |= 0x800
                      zf.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

              with zipfile.ZipFile(out, "r") as zf:
                  bad = zf.testzip()
                  if bad is not None:
                      raise SystemExit(f"Uszkodzony ZIP {out}: {bad}")
                  expected_skill = f"{skill_dir.name}/SKILL.md"
                  if expected_skill not in zf.namelist():
                      raise SystemExit(f"Brak {expected_skill} w {out}")
                  if len([n for n in zf.namelist() if not n.endswith("/")]) != len(files):
                      raise SystemExit(
                          f"{out}: liczba plików ZIP nie zgadza się z katalogiem źródłowym"
                      )

          for name in skills:
              skill_dir = source_root / name
              if not skill_dir.is_dir():
                  raise SystemExit(f"Brak katalogu {skill_dir}")
              files = verify_skill(skill_dir)
              out = target_root / f"{name}.zip"
              build_zip(skill_dir, files, out)
              print(f"OK {name}: {len(files)} plików -> {out} ({out.stat().st_size} B)")
          PY

      - name: Commit rebuilt archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "WERSJA ROZWOJOWA/shared.zip"             "WERSJA ROZWOJOWA/orzeczenia-sadowe-v2.zip"             "WERSJA ROZWOJOWA/audyt-systemu-v4.zip"

          if git diff --cached --quiet; then
            echo "Archiwa już odpowiadają źródłom; brak commita."
            exit 0
          fi

          git commit -m "Repack core development skills from verified sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
