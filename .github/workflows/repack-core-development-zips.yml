name: Repack core development ZIPs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checksums and build complete ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          source_root = Path("Wersja rozwojowa rozpakowana")
          target_root = Path("WERSJA ROZWOJOWA")
          skills = ("shared", "orzeczenia-sadowe-v2", "audyt-systemu-v4")
          fixed_dt = (1980, 1, 1, 0, 0, 0)

          for name in skills:
              skill_dir = source_root / name
              checksum_file = skill_dir / "CHECKSUMS.sha256"
              expected = {}

              for raw in checksum_file.read_text(encoding="utf-8").splitlines():
                  raw = raw.strip()
                  if not raw:
                      continue
                  digest, rel = raw.split(None, 1)
                  rel = rel.strip()
                  if rel.startswith("./"):
                      rel = rel[2:]
                  expected[rel] = digest.lower()

              files = sorted(p for p in skill_dir.rglob("*") if p.is_file())
              payload = [
                  p for p in files
                  if p.relative_to(skill_dir).as_posix() != "CHECKSUMS.sha256"
              ]

              actual_names = {p.relative_to(skill_dir).as_posix() for p in payload}
              expected_names = set(expected)
              if actual_names != expected_names:
                  missing = sorted(actual_names - expected_names)
                  stale = sorted(expected_names - actual_names)
                  raise SystemExit(
                      f"{name}: checksum manifest mismatch; missing={missing}; stale={stale}"
                  )

              for p in payload:
                  rel = p.relative_to(skill_dir).as_posix()
                  actual = hashlib.sha256(p.read_bytes()).hexdigest()
                  if actual != expected[rel]:
                      raise SystemExit(
                          f"{name}: SHA-256 mismatch for {rel}: "
                          f"{actual} != {expected[rel]}"
                      )

              out = target_root / f"{name}.zip"
              out.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(
                  out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9
              ) as zf:
                  for p in files:
                      rel = p.relative_to(skill_dir)
                      arcname = (Path(name) / rel).as_posix()
                      info = zipfile.ZipInfo(arcname, date_time=fixed_dt)
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = 0o100644 << 16
                      info.flag_bits |= 0x800
                      zf.writestr(
                          info,
                          p.read_bytes(),
                          compress_type=zipfile.ZIP_DEFLATED,
                          compresslevel=9,
                      )

              with zipfile.ZipFile(out, "r") as zf:
                  if zf.testzip() is not None:
                      raise SystemExit(f"{name}: corrupt ZIP")
                  archived = [n for n in zf.namelist() if not n.endswith("/")]
                  if len(archived) != len(files):
                      raise SystemExit(
                          f"{name}: ZIP file count {len(archived)} != source {len(files)}"
                      )
                  if f"{name}/SKILL.md" not in archived:
                      raise SystemExit(f"{name}: SKILL.md missing from ZIP")

              print(f"OK {name}: {len(files)} files, {out.stat().st_size} bytes")
          PY

      - name: Commit ZIPs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "WERSJA ROZWOJOWA/shared.zip"
          git add "WERSJA ROZWOJOWA/orzeczenia-sadowe-v2.zip"
          git add "WERSJA ROZWOJOWA/audyt-systemu-v4.zip"

          if git diff --cached --quiet; then
            echo "ZIPs already match verified sources."
            exit 0
          fi

          git commit -m "Repack core development skills from verified sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
