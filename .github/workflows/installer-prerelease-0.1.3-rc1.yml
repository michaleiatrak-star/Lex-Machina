name: Lex Machina 0.1.3 Installer Prerelease

on:
  push:
    branches:
      - "release/0.1.3-rc.1"

permissions:
  contents: read

jobs:
  online:
    uses: ./.github/workflows/lex-installer.yml

  offline:
    uses: ./.github/workflows/offline-windows-installer.yml
    with:
      signed: false

  publish-prerelease:
    name: Publish verified installer prerelease
    needs:
      - online
      - offline
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.3-rc.1

    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download online installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: LexMachina-Windows-Online-Installer
          path: release-assets/online

      - name: Download offline installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: LexMachina-Windows-Offline-Setup
          path: release-assets/offline

      - name: Normalize and independently hash release assets
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "release-dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $online = Get-ChildItem "release-assets/online" -File -Recurse -Filter "*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $online) { throw "RELEASE_ONLINE_INSTALLER_MISSING" }

          $offline = Get-ChildItem "release-assets/offline" -File -Recurse -Filter "LexMachina-Offline-Setup.exe" | Select-Object -First 1
          if (-not $offline) { throw "RELEASE_OFFLINE_INSTALLER_MISSING" }

          $onlineOut = Join-Path $dist "LexMachina-Online-Setup.exe"
          $offlineOut = Join-Path $dist "LexMachina-Offline-Setup.exe"
          Copy-Item -LiteralPath $online.FullName -Destination $onlineOut -Force
          Copy-Item -LiteralPath $offline.FullName -Destination $offlineOut -Force

          foreach ($name in @("SHA256.txt", "SHA256-OFFLINE.txt", "component-lock-offline.json")) {
            $source = Get-ChildItem "release-assets" -File -Recurse -Filter $name | Select-Object -First 1
            if ($source) { Copy-Item -LiteralPath $source.FullName -Destination (Join-Path $dist $name) -Force }
          }

          Copy-Item -LiteralPath "app/installer/windows-release-source.json" -Destination (Join-Path $dist "windows-release-source.json") -Force

          $hashLines = @()
          foreach ($file in @($onlineOut, $offlineOut)) {
            $item = Get-Item -LiteralPath $file
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $item.FullName).Hash.ToLowerInvariant()
            $hashLines += "$hash  $($item.Name)"
            Write-Host "$($item.Name): sha256=$hash bytes=$($item.Length)"
          }
          [IO.File]::WriteAllLines((Join-Path $dist "SHA256SUMS.txt"), $hashLines, [Text.UTF8Encoding]::new($false))
          "dist=$dist" >> $env:GITHUB_OUTPUT

      - name: Verify release metadata contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content -Raw "release-dist/windows-release-source.json" | ConvertFrom-Json
          if ($manifest.applicationVersion -ne "0.1.3") { throw "RELEASE_VERSION_MISMATCH:$($manifest.applicationVersion)" }
          if ($manifest.localAi.delivery -ne "USER_INITIATED_AFTER_INSTALL") { throw "RELEASE_LOCAL_AI_DELIVERY_POLICY_INVALID" }
          if (@($manifest.applicationUpdate.trustedSignerThumbprints).Count -gt 0) {
            Write-Host "Production Authenticode trust root is configured."
          } else {
            Write-Host "Prerelease is not trusted for self-update; application updater remains fail-closed."
          }

      - name: Write prerelease notes
        shell: pwsh
        run: |
          $notes = @(
            "# Lex Machina 0.1.3 RC1 — Windows installers",
            "",
            "Verified installer prerelease built from commit $env:GITHUB_SHA.",
            "",
            "## Installers",
            "",
            "- **LexMachina-Online-Setup.exe** — thin installer; downloads and SHA-256 verifies required private runtime components during installation.",
            "- **LexMachina-Offline-Setup.exe** — standalone offline installer; installs the required private runtime without network access.",
            "",
            "Local AI is intentionally **not** bundled with either installer. After application installation, an administrator explicitly selects a local model and context profile. llama.cpp/model components are downloaded and SHA-256 verified on demand.",
            "",
            "## Local AI and context",
            "",
            "- selectable runtime context 64,000–200,000 tokens subject to actual runtime validation;",
            "- contexts above model-native capacity are explicitly marked as YaRN-extended;",
            "- selected context is smoke-tested locally before configuration is accepted;",
            "- live download progress, hardware discovery, repair/removal and a context qualification receipt are included.",
            "",
            "## Update/security status",
            "",
            "- installer state machine: Fresh / Upgrade / Repair / Current / DowngradeBlocked;",
            "- existing custom install location is preserved; mismatched upgrade roots fail closed;",
            "- application, skill and model update channels have independent trust roots;",
            "- skill/model signed-index channels remain fail-closed until production Ed25519 public keys are configured;",
            "- application self-update remains fail-closed until the production Authenticode publisher thumbprint/certificate is configured.",
            "",
            "This is a **prerelease**, not the final production-signed channel. Verify SHA256SUMS.txt and the included release manifest."
          )
          [IO.File]::WriteAllLines("release-dist/RELEASE-NOTES.md", $notes, [Text.UTF8Encoding]::new($false))

      - name: Create or update GitHub prerelease
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $notes = "release-dist/RELEASE-NOTES.md"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Lex Machina 0.1.3 RC1" --notes-file $notes --prerelease --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "RELEASE_EDIT_FAILED:$LASTEXITCODE" }
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Lex Machina 0.1.3 RC1" --notes-file $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw "RELEASE_CREATE_FAILED:$LASTEXITCODE" }
          }

          $assets = @(
            "release-dist/LexMachina-Online-Setup.exe",
            "release-dist/LexMachina-Offline-Setup.exe",
            "release-dist/SHA256SUMS.txt",
            "release-dist/SHA256.txt",
            "release-dist/SHA256-OFFLINE.txt",
            "release-dist/component-lock-offline.json",
            "release-dist/windows-release-source.json",
            "release-dist/RELEASE-NOTES.md"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber @assets
          if ($LASTEXITCODE -ne 0) { throw "RELEASE_UPLOAD_FAILED:$LASTEXITCODE" }

      - name: Verify published prerelease assets
        shell: pwsh
        run: |
          $json = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isPrerelease,tagName,targetCommitish,assets
          if ($LASTEXITCODE -ne 0) { throw "RELEASE_VERIFY_LOOKUP_FAILED:$LASTEXITCODE" }
          $release = $json | ConvertFrom-Json
          if (-not $release.isPrerelease -or $release.tagName -ne $env:RELEASE_TAG) { throw "RELEASE_VERIFY_METADATA_INVALID" }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($required in @("LexMachina-Online-Setup.exe", "LexMachina-Offline-Setup.exe", "SHA256SUMS.txt", "windows-release-source.json")) {
            if ($names -notcontains $required) { throw "RELEASE_VERIFY_ASSET_MISSING:$required" }
          }
          Write-Host "INSTALLER_PRERELEASE_PUBLISHED:$($release.tagName)"
