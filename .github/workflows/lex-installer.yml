name: Lex Windows Online Installer

on:
  workflow_call:
  pull_request:
    paths:
      - "app/installer/**"
      - "app/lex-desktop/**"
      - "app/lex-runtime/**"
      - "app/lex-web/**"
      - "app/ocr/**"
      - "app/privacy/**"
      - "app/storage/**"
      - "app/lex-version.yaml"
      - "Wersja rozwojowa rozpakowana/**"
      - ".github/workflows/lex-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lex-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  g33d-windows-online-installer:
    name: G33D Windows online installer build and acceptance
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Install runtime validation dependencies
        working-directory: app/lex-runtime
        run: npm install --no-audit --no-fund

      - name: G39J reject correctly hashed foreign-signed installer
        working-directory: app/lex-runtime
        run: npx vitest run tests/application-update-authenticode-windows.test.ts

      - name: G33D static release contract
        working-directory: app/lex-runtime
        run: npm run validate:g33d

      - name: Embedded Python hidden-stdio smoke test
        shell: pwsh
        run: ./app/installer/windows-embedded-python-smoke.ps1

      - name: Install web build dependencies
        working-directory: app/lex-web
        run: npm install --no-audit --no-fund

      - name: Install desktop build dependencies
        working-directory: app/lex-desktop
        run: npm install --no-audit --no-fund

      - name: Chat model and deterministic skill selection contracts
        working-directory: app/lex-web
        run: npx vitest run src/MatterChatApp.primary-model.test.ts src/chat-routing.test.ts

      - name: Local primary credential policy wired into both chat surfaces
        shell: pwsh
        run: |
          $paths = @(
            "app/lex-web/src/MatterChatApp.tsx",
            "app/lex-web/src/ChatApp.tsx"
          )
          $required = @(
            "shouldLoadPrimaryModelCatalog(",
            "canExecutePrimaryModel(",
            "runtimeProviderForPrimarySource("
          )
          foreach ($path in $paths) {
            $source = Get-Content -Raw -LiteralPath $path
            foreach ($needle in $required) {
              if (-not $source.Contains($needle)) {
                throw "LOCAL_PRIMARY_POLICY_NOT_WIRED:${path}:${needle}"
              }
            }
            if ($source -match 'providerConfigured\s*!==\s*true') {
              throw "LOCAL_PRIMARY_DIRECT_CREDENTIAL_GATE_REINTRODUCED:${path}"
            }
          }

      - name: Build thin online bootstrap payload
        shell: pwsh
        run: ./app/installer/build-windows-online.ps1

      - name: Build NSIS online installer
        working-directory: app/lex-desktop
        run: npx tauri build --bundles nsis

      - name: Windows branding acceptance
        shell: pwsh
        run: |
          $installer = Get-ChildItem "app\lex-desktop\src-tauri\target\release\bundle\nsis\*.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS_INSTALLER_NOT_FOUND_FOR_BRANDING" }
          ./app/installer/windows-branding-selftest.ps1 `
            -DesktopExePath "app/lex-desktop/src-tauri/target/release/lex-machina.exe" `
            -InstallerPath $installer.FullName

      - name: Provision VC++ prerequisite for unattended acceptance runner
        shell: pwsh
        run: |
          # The product bootstrap can elevate interactively when VC++ is absent.
          # GitHub Actions has no interactive UAC surface, so provision the exact
          # pinned prerequisite up front and let the installer exercise the rest
          # of the real online bootstrap path without an invisible elevation wait.
          $manifest = Get-Content -Raw "app/installer/windows-release-source.json" | ConvertFrom-Json
          $vc = $manifest.systemPrerequisites.visualCppRuntime
          if ($vc.sha256 -notmatch '^[a-fA-F0-9]{64}$') {
            throw "ACCEPTANCE_VC_HASH_INVALID"
          }

          $vcInstaller = Join-Path $env:RUNNER_TEMP "vc_redist.x64-$($vc.version).exe"
          Invoke-WebRequest -UseBasicParsing -Uri $vc.url -OutFile $vcInstaller
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $vcInstaller).Hash.ToLowerInvariant()
          if ($actual -ne $vc.sha256.ToLowerInvariant()) {
            throw "ACCEPTANCE_VC_HASH_MISMATCH expected=$($vc.sha256) actual=$actual"
          }

          $install = Start-Process -FilePath $vcInstaller -ArgumentList @(
            "/install", "/quiet", "/norestart"
          ) -Wait -PassThru
          if ($install.ExitCode -notin @(0, 1638, 3010)) {
            throw "ACCEPTANCE_VC_INSTALL_FAILED:$($install.ExitCode)"
          }
          Write-Host "Acceptance VC++ prerequisite exit code: $($install.ExitCode)"

      - name: Reproduce pre-existing same-version Python registration
        shell: pwsh
        run: |
          # RC3 field failure: the CPython full installer can enter maintenance
          # mode when the same version is already registered and then return 0
          # without provisioning Lex Machina's requested private TargetDir.
          # Register the exact pinned Python first; the product installer must
          # still succeed because it now uses the application-local embeddable
          # distribution and never reuses this registered installation.
          $manifest = Get-Content -Raw "app/installer/windows-release-source.json" | ConvertFrom-Json
          $python = $manifest.runtime.python
          $foreignInstaller = Join-Path $env:RUNNER_TEMP "foreign-python-$($python.version)-amd64.exe"
          Invoke-WebRequest -UseBasicParsing -Uri $python.url -OutFile $foreignInstaller
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $foreignInstaller).Hash.ToLowerInvariant()
          if ($actualHash -ne $python.sha256.ToLowerInvariant()) {
            throw "ACCEPTANCE_FOREIGN_PYTHON_HASH_MISMATCH expected=$($python.sha256) actual=$actualHash"
          }

          $foreignRoot = Join-Path $env:RUNNER_TEMP ("Foreign Python " + $python.version)
          $foreignArgs = @(
            "/quiet",
            "InstallAllUsers=0",
            ('TargetDir="{0}"' -f $foreignRoot),
            "Include_launcher=0",
            "Include_test=0",
            "Include_doc=0",
            "Include_tcltk=0",
            "Include_tools=0",
            "Include_pip=0",
            "PrependPath=0",
            "Shortcuts=0"
          ) -join " "
          $proc = Start-Process -FilePath $foreignInstaller -ArgumentList $foreignArgs -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "ACCEPTANCE_FOREIGN_PYTHON_INSTALL_FAILED:$($proc.ExitCode)"
          }
          $foreignExe = Join-Path $foreignRoot "python.exe"
          if (-not (Test-Path -LiteralPath $foreignExe -PathType Leaf)) {
            throw "ACCEPTANCE_FOREIGN_PYTHON_MISSING:$foreignExe"
          }
          $foreignVersion = (& $foreignExe --version 2>&1 | Select-Object -First 1).ToString().Trim()
          if ($foreignVersion -ne "Python $($python.version)") {
            throw "ACCEPTANCE_FOREIGN_PYTHON_VERSION_INVALID:$foreignVersion"
          }
          Write-Host "Pre-existing registered Python ready: $foreignRoot"

      - name: G33D installed-copy online bootstrap acceptance
        shell: pwsh
        run: |
          $installer = Get-ChildItem "app\lex-desktop\src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS_INSTALLER_NOT_FOUND" }

          # Regression coverage for the real per-user path reported in RC2/RC3:
          # spaces plus a Polish character must survive NSIS -> PowerShell ->
          # app-local CPython extraction and package provisioning, even while
          # the same CPython version is already registered elsewhere.
          $installRoot = Join-Path $env:RUNNER_TEMP (
            "Lex Machina Michał Acceptance-" + [Guid]::NewGuid().ToString("N")
          )
          Write-Host "G33D path-with-spaces/unicode acceptance root: $installRoot"
          ./app/installer/windows-installer-acceptance.ps1 `
            -InstallerPath $installer.FullName `
            -InstallRoot $installRoot

      - name: Record installer SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem "app\lex-desktop\src-tauri\target\release\bundle\nsis\*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "installer=$($installer.Name)" | Out-File -FilePath "app\lex-desktop\src-tauri\target\release\bundle\nsis\SHA256.txt" -Encoding utf8
          "sha256=$hash" | Out-File -FilePath "app\lex-desktop\src-tauri\target\release\bundle\nsis\SHA256.txt" -Encoding utf8 -Append
          "bytes=$($installer.Length)" | Out-File -FilePath "app\lex-desktop\src-tauri\target\release\bundle\nsis\SHA256.txt" -Encoding utf8 -Append
          Get-Content "app\lex-desktop\src-tauri\target\release\bundle\nsis\SHA256.txt"

      - name: Publish online installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LexMachina-Windows-Online-Installer
          path: |
            app/lex-desktop/src-tauri/target/release/bundle/nsis/*.exe
            app/lex-desktop/src-tauri/target/release/bundle/nsis/SHA256.txt
            app/lex-desktop/src-tauri/runtime/release-source.json
            app/lex-desktop/src-tauri/runtime/release-requirements.txt
            app/lex-desktop/src-tauri/runtime/npm-dependency-tree.json
          if-no-files-found: error
          retention-days: 7
