name: Package DR11 portability fix

on:
  push:
    branches:
      - portability/dr-batch-01
    paths:
      - '.github/workflows/package-dr11-portability-fix.yml'
      - '.github/portability/package_dr11_fix.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build repaired DR11
        run: python .github/portability/package_dr11_fix.py
      - name: Verify checksums
        run: cd staging/dr-11-cyfrowe-cyber-ai-dane-ip && sha256sum -c CHECKSUMS.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dr-11-cyfrowe-cyber-ai-dane-ip
          path: staging
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
