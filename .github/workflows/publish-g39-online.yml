name: Publish G39 Online Installer

on:
  push:
    branches:
      - release/0.1.3-g39-rc1
    paths:
      - ".release/online-source-sha.txt"

permissions:
  contents: write
  actions: read

jobs:
  publish-online:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: v0.1.3-g39-rc1
      RELEASE_TITLE: Lex Machina v0.1.3 G39 RC1

    steps:
      - name: Checkout release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve validated source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(tr -d '\r\n ' < .release/online-source-sha.txt)"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "INVALID_ONLINE_RELEASE_SOURCE_SHA" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha" >/dev/null
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify exact-source release gates
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ steps.source.outputs.sha }}"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$source_sha&status=success&per_page=100")"

          for workflow in \
            ".github/workflows/lex-runtime.yml" \
            ".github/workflows/f138-structural-audit.yml" \
            ".github/workflows/g39-installer-state.yml" \
            ".github/workflows/lex-installer.yml"; do
            count="$(jq -r --arg path "$workflow" '[.workflow_runs[] | select(.path == $path and .conclusion == "success")] | length' <<<"$runs")"
            if [[ "$count" -lt 1 ]]; then
              echo "ONLINE_RELEASE_REQUIRED_WORKFLOW_NOT_GREEN:$workflow" >&2
              exit 1
            fi
          done

          online_run="$(jq -r '
            [.workflow_runs[]
              | select(.path == ".github/workflows/lex-installer.yml")
              | select(.conclusion == "success")]
            | sort_by(.run_number)
            | last
            | .id // empty
          ' <<<"$runs")"

          if [[ -z "$online_run" ]]; then
            echo "ONLINE_RELEASE_ACCEPTED_RUN_NOT_FOUND" >&2
            exit 1
          fi
          echo "online_run=$online_run" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download accepted online artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-input release-out
          run_id="${{ steps.gates.outputs.online_run }}"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_id="$(jq -r '
            [.artifacts[]
              | select(.name == "LexMachina-Windows-Online-Installer")
              | select(.expired == false)]
            | first
            | .id // empty
          ' <<<"$artifacts")"
          if [[ -z "$artifact_id" ]]; then
            echo "ONLINE_RELEASE_ARTIFACT_NOT_FOUND" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > release-input/artifact.zip
          unzip -q release-input/artifact.zip -d release-input/files
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify receipt and stage online installer
        shell: bash
        run: |
          set -euo pipefail
          sha_file="$(find release-input/files -type f -name 'SHA256.txt' -print -quit)"
          installer="$(find release-input/files -type f -name '*.exe' -print -quit)"
          if [[ -z "$sha_file" || ! -f "$sha_file" || -z "$installer" || ! -f "$installer" ]]; then
            echo "ONLINE_RELEASE_EXPECTED_FILE_MISSING" >&2
            exit 1
          fi

          expected="$(awk -F= '$1=="sha256"{print $2}' "$sha_file" | tr -d '\r\n ')"
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          if [[ "$expected" != "$actual" ]]; then
            echo "ONLINE_RELEASE_HASH_MISMATCH expected=$expected actual=$actual" >&2
            exit 1
          fi

          cp "$installer" release-out/Lex-Machina-0.1.3-G39-Online-x64-Setup.exe
          cp "$sha_file" release-out/CI-SHA256-ONLINE.txt
          printf '%s  %s\n' "$actual" "Lex-Machina-0.1.3-G39-Online-x64-Setup.exe" > release-out/SHA256-ONLINE.txt

      - name: Write online-first release notes
        shell: bash
        run: |
          cat > release-out/RELEASE-NOTES-ONLINE.md <<'EOF'
          ## Lex Machina 0.1.3 — G39 RC1

          Pierwszy artefakt RC został opublikowany po pełnym PASS runtime, F-138, G39 installer state oraz Windows Online installed-copy acceptance na tym samym source SHA.

          Dostępny teraz:
          - Online x64 Setup — zweryfikowany przez CI, z dołączonym SHA-256.

          Offline x64 Setup pozostaje w weryfikacji clean-machine i zostanie dołączony do tego samego prerelease po uzyskaniu PASS.

          To jest ręczny prerelease. Produkcyjne kanały auto-update aplikacji/skilli/model-packów pozostają fail-closed do czasu skonfigurowania produkcyjnych trust roots i podpisów.
          EOF

      - name: Create or update prerelease with online installer
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ steps.source.outputs.sha }}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-out/RELEASE-NOTES-ONLINE.md \
              --prerelease \
              --target "$source_sha"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-out/RELEASE-NOTES-ONLINE.md \
              --prerelease \
              --target "$source_sha"
          fi

          gh release upload "$RELEASE_TAG" --clobber \
            release-out/Lex-Machina-0.1.3-G39-Online-x64-Setup.exe \
            release-out/SHA256-ONLINE.txt \
            release-out/CI-SHA256-ONLINE.txt

          gh release view "$RELEASE_TAG" --json url,tagName,name,isPrerelease,publishedAt
        env:
          GH_TOKEN: ${{ github.token }}
