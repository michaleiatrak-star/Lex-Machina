name: Package analiza-sadowa-v6 portability

on:
  push:
    branches:
      - portability/analiza-sadowa-v6-01
    paths:
      - '.github/workflows/package-analiza-sadowa-v6-portability.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4

      - name: Stage complete source skill
        shell: bash
        run: |
          set -euo pipefail
          SRC='Wersja rozwojowa rozpakowana/analiza-sadowa-v6'
          test -f "$SRC/SKILL.md"
          rm -rf staging
          mkdir -p staging
          cp -a "$SRC" staging/analiza-sadowa-v6
          SRC_COUNT=$(find "$SRC" -type f | wc -l | tr -d ' ')
          DST_COUNT=$(find staging/analiza-sadowa-v6 -type f | wc -l | tr -d ' ')
          echo "original source files=$SRC_COUNT staged=$DST_COUNT"
          test "$SRC_COUNT" = "$DST_COUNT"

      - name: Apply minimal runtime portability adapter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, re
          p = Path('staging/analiza-sadowa-v6/SKILL.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('compatibility: "web_search, web_fetch, show_widget"','compatibility: "live_web_lookup, file_read, optional_interactive_ui"',1)
          desc_pattern = re.compile(r'description: \|\n(?:  .*\n)+?  v6: model CZTEROPRZEBIEGOWY z obowiązkową DWUKROTNĄ WERYFIKACJĄ dowodów i pism\.\n', re.M)
          short_desc = 'description: "Analiza akt i dokumentów prawnych: fakty, dowody, normy, orzecznictwo, terminy, koszty i szanse procesowe. Model 4-przebiegowy z dwukrotną weryfikacją; opcjonalny dashboard."\n'
          text, n = desc_pattern.subn(short_desc, text, count=1)
          if n != 1: raise SystemExit('description block not found exactly once')
          text = text.replace('Przed wpisaniem JAKIEJKOLWIEK normy do macierzy fakt-norma Claude MUSI:','Przed wpisaniem JAKIEJKOLWIEK normy do macierzy fakt-norma asystent MUSI:',1)
          payload = ''
          adapter = base64.b64decode(payload).decode('utf-8')
          marker = '---\n\n**Zasada progressive disclosure:**'
          if marker not in text: raise SystemExit('frontmatter closing marker not found')
          text = text.replace(marker, '---\n\n' + adapter + '\n**Zasada progressive disclosure:**', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Bundle recursive shared dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, shutil
          skill = Path('staging/analiza-sadowa-v6')
          shared_src = Path('Wersja rozwojowa rozpakowana/shared')
          shared_dst = skill / 'shared'
          shared_dst.mkdir(exist_ok=True)
          patterns = [re.compile(r'/mnt/skills/user/shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml))'),re.compile(r'(?<![A-Za-z0-9_.\-/])shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml))')]
          copied, missing = set(), set()
          def text_files():
              return [f for f in skill.rglob('*') if f.is_file() and f.suffix.lower() in {'.md','.txt','.json','.py','.sh','.yaml','.yml'}]
          changed = True
          while changed:
              changed = False
              refs = set()
              for f in text_files():
                  try: data = f.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  for pat in patterns: refs.update(m.group(1) for m in pat.finditer(data))
              for rel in sorted(refs):
                  src, dst = shared_src / rel, shared_dst / rel
                  if dst.exists(): continue
                  if not src.is_file(): missing.add(rel); continue
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst); copied.add(rel); changed = True
          if missing: raise SystemExit('Missing shared dependencies: ' + ', '.join(sorted(missing)))
          print(f'Bundled shared dependency files: {len(copied)}')
          for rel in sorted(copied): print('  shared/' + rel)
          PY

      - name: Create portability manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          root = Path('staging/analiza-sadowa-v6')
          source_root = Path('Wersja rozwojowa rozpakowana/analiza-sadowa-v6')
          source_count = sum(1 for p in source_root.rglob('*') if p.is_file())
          shared_files = sorted(str(p.relative_to(root)) for p in (root/'shared').rglob('*') if p.is_file())
          skill_text = (root/'SKILL.md').read_text(encoding='utf-8')
          m = re.search(r'^description:\s*"(.*?)"\s*$', skill_text, re.M)
          if not m: raise SystemExit('portable description not found')
          desc_len = len(m.group(1))
          if desc_len > 200: raise SystemExit(f'description length {desc_len} > 200')
          manifest = root / 'PORTABILITY-MANIFEST.md'
          lines = ['# Portability manifest — analiza-sadowa-v6','', '- Source repository: `michaleiatrak-star/Lex-Machina`','- Source commit: `bdebb4b0b6ba63add44501795c6e4acdc5bfd931`','- Original skill tree SHA: `4ae1d0bab70923a6ff960a2cf85038cb001b10f5`',f'- Original skill files preserved before portability additions: **{source_count}**',f'- Bundled recursive `shared/` dependency files: **{len(shared_files)}**',f'- Frontmatter description length: **{desc_len}/200**','', '## Changes limited to runtime portability','', '1. Host-specific compatibility metadata made tool-name-neutral.','2. Frontmatter description compacted to the common 200-character profile; detailed triggers remain in SKILL.md body.','3. `Claude MUSI` changed to `asystent MUSI` in one imperative.','4. Added a runtime adapter defining legacy tool names and `/mnt/...` paths as semantic aliases.','5. Added local copies of the recursive shared dependency closure for standalone ZIP use.','6. No legal methodology, gates, scoring, report schema, filters or specialist modules were rewritten.','', '## Bundled shared files','']
          lines += [f'- `{x}`' for x in shared_files]
          lines += ['', '## External integrations intentionally not vendored','', 'Other skills named in the instructions (for example `prawny-router-v3` or `raport-sytuacyjny-v2`) remain separate skills. The runtime adapter defines a graceful fallback when such an integration is unavailable.','']
          manifest.write_text('\n'.join(lines), encoding='utf-8')
          checksum = root / 'CHECKSUMS.sha256'
          rows=[]
          for f in sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'CHECKSUMS.sha256'):
              rows.append(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.relative_to(root).as_posix()}')
          checksum.write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY

      - name: Validate portability and completeness
        shell: bash
        run: |
          set -euo pipefail
          ROOT='staging/analiza-sadowa-v6'
          test -f "$ROOT/SKILL.md"
          test -f "$ROOT/PORTABILITY-MANIFEST.md"
          test -f "$ROOT/CHECKSUMS.sha256"
          test -d "$ROOT/references"
          test -d "$ROOT/shared"
          COUNT=$(find "$ROOT" -type f | wc -l | tr -d ' ')
          echo "FINAL_FILES=$COUNT"
          if [ "$COUNT" -gt 200 ]; then echo "ERROR: final skill has $COUNT files; hard limit is 200" >&2; exit 1; fi
          ! grep -q 'compatibility: "web_search, web_fetch, show_widget"' "$ROOT/SKILL.md"
          ! grep -q 'fakt-norma Claude MUSI' "$ROOT/SKILL.md"
          grep -q '^## ADAPTER RUNTIME — PORTABILITY' "$ROOT/SKILL.md"
          (cd "$ROOT" && sha256sum -c CHECKSUMS.sha256)

      - name: Upload one skill as one ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: analiza-sadowa-v6
          path: staging
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
