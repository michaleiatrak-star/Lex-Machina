name: Package analiza-sadowa-v6 portability

on:
  push:
    branches:
      - portability/analiza-sadowa-v6-01
    paths:
      - '.github/workflows/package-analiza-sadowa-v6-portability.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4

      - name: Stage complete source skill
        shell: bash
        run: |
          set -euo pipefail
          SRC='Wersja rozwojowa rozpakowana/analiza-sadowa-v6'
          test -f "$SRC/SKILL.md"
          rm -rf staging
          mkdir -p staging
          cp -a "$SRC" staging/analiza-sadowa-v6
          SRC_COUNT=$(find "$SRC" -type f | wc -l | tr -d ' ')
          DST_COUNT=$(find staging/analiza-sadowa-v6 -type f | wc -l | tr -d ' ')
          echo "original source files=$SRC_COUNT staged=$DST_COUNT"
          test "$SRC_COUNT" = "$DST_COUNT"

      - name: Apply minimal runtime portability adapter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('staging/analiza-sadowa-v6/SKILL.md')
          text = p.read_text(encoding='utf-8')

          # Frontmatter: keep semantics, make only the metadata host-neutral and compact.
          text = text.replace(
              'compatibility: "web_search, web_fetch, show_widget"',
              'compatibility: "live_web_lookup, file_read, optional_interactive_ui"',
              1,
          )

          # Replace the multi-line description block only; detailed triggers remain in the body.
          desc_pattern = re.compile(r'description: \|\n(?:  .*\n)+?  v6: model CZTEROPRZEBIEGOWY z obowiązkową DWUKROTNĄ WERYFIKACJĄ dowodów i pism\.\n', re.M)
          short_desc = (
              'description: "Analiza akt i dokumentów prawnych: fakty, dowody, normy, orzecznictwo, terminy, koszty i szanse procesowe. Model 4-przebiegowy z dwukrotną weryfikacją; opcjonalny dashboard."\n'
          )
          text, n = desc_pattern.subn(short_desc, text, count=1)
          if n != 1:
              raise SystemExit('description block not found exactly once')

          # Remove the only agent-name dependency that changes the subject of an imperative.
          text = text.replace(
              'Przed wpisaniem JAKIEJKOLWIEK normy do macierzy fakt-norma Claude MUSI:',
              'Przed wpisaniem JAKIEJKOLWIEK normy do macierzy fakt-norma asystent MUSI:',
              1,
          )

          adapter = r'''## ADAPTER RUNTIME — PORTABILITY (ChatGPT / Claude / inne hosty)

Ta sekcja zmienia wyłącznie sposób wykonania operacji technicznych. Nie zmienia metodologii prawnej,
hard gate'ów, kolejności przejść ani kryteriów dowodowych tego skilla.

1. Nazwy `view`, `web_search`, `web_fetch`, `show_widget`, `visualize:read_me` i `present_files`
   występujące w tym pliku lub w `references/` traktuj jako **nazwy operacji semantycznych**, a nie
   wymagane literalne nazwy narzędzi. Użyj równoważnej funkcji dostępnej w bieżącym hoście.
2. `view /mnt/skills/user/analiza-sadowa-v6/...` oznacza odczyt odpowiedniego pliku lokalnego
   tego pakietu (np. `references/...`). Nie wymagaj istnienia literalnego katalogu `/mnt/skills`.
3. `view /mnt/skills/user/shared/<plik>` oznacza odczyt kanonicznego zasobu shared. Rozwiązuj
   w kolejności: (a) dołączony do ZIP-a `shared/<plik>`, (b) sibling `../shared/<plik>` w repo,
   (c) zasób udostępniony przez bieżący host. Brak literalnej ścieżki `/mnt/skills` nie jest błędem.
4. `view /mnt/user-data/uploads/{plik}` oznacza **ponowne otwarcie rzeczywiście załączonego pliku**
   przez mechanizm plików bieżącego hosta. Nie zastępuj tego pamięcią kontekstu.
5. `web_search` / `web_fetch` oznaczają świeże wyszukanie i odczyt źródła. Dla prawa i orzecznictwa
   zachowaj istniejący wymóg źródła urzędowego/oficjalnego i cytowania; nie używaj pamięci modelu.
6. `show_widget` / `visualize:read_me` oznaczają interaktywny widok, gdy host go obsługuje.
   Jeśli nie obsługuje, wygeneruj równoważny dashboard jako ustrukturyzowaną odpowiedź/HTML lub
   inny natywny artefakt hosta. Brak React/JSX nie może blokować analizy merytorycznej.
7. Odwołania do innych skilli (`prawny-router-v3`, `raport-sytuacyjny-v2`, itp.) są integracjami
   między-skillowymi, nie plikami tego skilla. Jeżeli integracja nie jest dostępna, wykonaj część
   lokalną możliwą do wykonania i jawnie wskaż pominięty krok integracyjny — bez zmyślania wyniku.

**Zasada nadrzędna adaptera:** jeżeli stara instrukcja jest wykonalna w bieżącym hoście bez
konwersji, wykonaj ją wprost. Adapter ma działać tylko tam, gdzie literalna nazwa narzędzia lub
ścieżka jest zależna od runtime.
'''

          marker = '---\n\n**Zasada progressive disclosure:**'
          if marker not in text:
              raise SystemExit('frontmatter closing marker not found')
          text = text.replace(marker, '---\n\n' + adapter + '\n**Zasada progressive disclosure:**', 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Bundle recursive shared dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, shutil

          skill = Path('staging/analiza-sadowa-v6')
          shared_src = Path('Wersja rozwojowa rozpakowana/shared')
          shared_dst = skill / 'shared'
          shared_dst.mkdir(exist_ok=True)

          patterns = [
              re.compile(r'/mnt/skills/user/shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml))'),
              re.compile(r'(?<![A-Za-z0-9_.\-/])shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml))'),
          ]

          copied = set()
          missing = set()

          def text_files():
              for f in skill.rglob('*'):
                  if f.is_file() and f.suffix.lower() in {'.md','.txt','.json','.py','.sh','.yaml','.yml'}:
                      yield f

          changed = True
          while changed:
              changed = False
              refs = set()
              for f in list(text_files()):
                  try:
                      data = f.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for pat in patterns:
                      refs.update(m.group(1) for m in pat.finditer(data))

              for rel in sorted(refs):
                  rel_path = Path(rel)
                  src = shared_src / rel_path
                  dst = shared_dst / rel_path
                  if dst.exists():
                      continue
                  if not src.is_file():
                      missing.add(rel)
                      continue
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  copied.add(rel)
                  changed = True

          if missing:
              raise SystemExit('Missing shared dependencies: ' + ', '.join(sorted(missing)))

          print(f'Bundled shared dependency files: {len(copied)}')
          for rel in sorted(copied):
              print('  shared/' + rel)
          PY

      - name: Create portability manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          root = Path('staging/analiza-sadowa-v6')
          source_root = Path('Wersja rozwojowa rozpakowana/analiza-sadowa-v6')
          source_count = sum(1 for p in source_root.rglob('*') if p.is_file())
          shared_files = sorted(str(p.relative_to(root)) for p in (root/'shared').rglob('*') if p.is_file())

          skill_text = (root/'SKILL.md').read_text(encoding='utf-8')
          m = re.search(r'^description:\s*["\'](.*?)["\']\s*$', skill_text, re.M)
          if not m:
              raise SystemExit('portable description not found')
          desc_len = len(m.group(1))
          if desc_len > 200:
              raise SystemExit(f'description length {desc_len} > 200')

          manifest = root / 'PORTABILITY-MANIFEST.md'
          manifest.write_text(
              '# Portability manifest — analiza-sadowa-v6\n\n'
              '- Source repository: `michaleiatrak-star/Lex-Machina`\n'
              '- Source commit: `bdebb4b0b6ba63add44501795c6e4acdc5bfd931`\n'
              '- Original skill tree SHA: `4ae1d0bab70923a6ff960a2cf85038cb001b10f5`\n'
              f'- Original skill files preserved before portability additions: **{source_count}**\n'
              f'- Bundled recursive `shared/` dependency files: **{len(shared_files)}**\n'
              f'- Frontmatter description length: **{desc_len}/200**\n\n'
              '## Changes limited to runtime portability\n\n'
              '1. Host-specific compatibility metadata made tool-name-neutral.\n'
              '2. Frontmatter description compacted to the common 200-character profile; detailed triggers remain in SKILL.md body.\n'
              '3. `Claude MUSI` changed to `asystent MUSI` in one imperative.\n'
              '4. Added a runtime adapter defining legacy tool names and `/mnt/...` paths as semantic aliases.\n'
              '5. Added local copies of the recursive shared dependency closure for standalone ZIP use.\n'
              '6. No legal methodology, gates, scoring, report schema, filters or specialist modules were rewritten.\n\n'
              '## Bundled shared files\n\n' + ''.join(f'- `{x}`\n' for x in shared_files) +
              '\n## External integrations intentionally not vendored\n\n'
              'Other skills named in the instructions (for example `prawny-router-v3` or `raport-sytuacyjny-v2`) remain separate skills. '
              'The runtime adapter defines a graceful fallback when such an integration is unavailable.\n',
              encoding='utf-8'
          )

          checksum = root / 'CHECKSUMS.sha256'
          rows = []
          for f in sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'CHECKSUMS.sha256'):
              digest = hashlib.sha256(f.read_bytes()).hexdigest()
              rows.append(f'{digest}  {f.relative_to(root).as_posix()}')
          checksum.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY

      - name: Validate portability and completeness
        shell: bash
        run: |
          set -euo pipefail
          ROOT='staging/analiza-sadowa-v6'
          test -f "$ROOT/SKILL.md"
          test -f "$ROOT/PORTABILITY-MANIFEST.md"
          test -f "$ROOT/CHECKSUMS.sha256"
          test -d "$ROOT/references"
          test -d "$ROOT/shared"

          COUNT=$(find "$ROOT" -type f | wc -l | tr -d ' ')
          echo "FINAL_FILES=$COUNT"
          if [ "$COUNT" -gt 200 ]; then
            echo "ERROR: final skill has $COUNT files; hard limit is 200" >&2
            exit 1
          fi

          ! grep -q 'compatibility: "web_search, web_fetch, show_widget"' "$ROOT/SKILL.md"
          ! grep -q 'fakt-norma Claude MUSI' "$ROOT/SKILL.md"
          grep -q '^## ADAPTER RUNTIME — PORTABILITY' "$ROOT/SKILL.md"

          (
            cd "$ROOT"
            sha256sum -c CHECKSUMS.sha256
          )

      - name: Upload one skill as one ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: analiza-sadowa-v6
          path: staging
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
