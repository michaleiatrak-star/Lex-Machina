name: Lex Machina 0.1.6 G39M RC14 Online Release

on:
  push:
    branches:
      - "release/0.1.6-g39m-rc14"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lex-release-0.1.6-g39m-rc14-${{ github.sha }}
  cancel-in-progress: true

jobs:
  provenance:
    name: Release provenance contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify G39M provenance metadata and version coherence
        shell: bash
        run: |
          set -euo pipefail

          expected_baseline="dd4b06985ae519417d9dd196ef6daf2542fcd927"
          expected_branch="release/0.1.6-g39m-rc14"
          expected_version="0.1.6"
          expected_icon_sha="055686adddaf980c1e2a92bd7957090fdac349529dbf60bc85fd0ef26e367b76"

          baseline="$(awk -F': ' '$1=="baseline_commit"{gsub(/"/,"",$2); print $2}' app/lex-version.yaml)"
          work_branch="$(awk -F': ' '$1=="work_branch"{gsub(/"/,"",$2); print $2}' app/lex-version.yaml)"
          app_version="$(awk -F': ' '$1=="application_version"{gsub(/"/,"",$2); print $2}' app/lex-version.yaml)"
          runtime_version="$(node -p "require('./app/lex-runtime/package.json').version")"
          web_version="$(node -p "require('./app/lex-web/package.json').version")"
          desktop_version="$(node -p "require('./app/lex-desktop/package.json').version")"
          tauri_version="$(node -p "require('./app/lex-desktop/src-tauri/tauri.conf.json').version")"
          installer_version="$(node -p "require('./app/installer/windows-release-source.json').applicationVersion")"

          [[ "$baseline" == "$expected_baseline" ]] || {
            echo "PROVENANCE_BASELINE_MISMATCH expected=$expected_baseline actual=$baseline" >&2
            exit 1
          }
          [[ "$work_branch" == "$expected_branch" ]] || {
            echo "PROVENANCE_BRANCH_MISMATCH expected=$expected_branch actual=$work_branch" >&2
            exit 1
          }
          [[ "$GITHUB_REF_NAME" == "$expected_branch" ]] || {
            echo "PROVENANCE_GITHUB_REF_MISMATCH expected=$expected_branch actual=$GITHUB_REF_NAME" >&2
            exit 1
          }

          git merge-base --is-ancestor "$baseline" "$GITHUB_SHA" || {
            echo "PROVENANCE_BASELINE_NOT_ANCESTOR baseline=$baseline source=$GITHUB_SHA" >&2
            exit 1
          }

          for observed in "$app_version" "$runtime_version" "$web_version" "$desktop_version" "$tauri_version" "$installer_version"; do
            [[ "$observed" == "$expected_version" ]] || {
              echo "PROVENANCE_VERSION_MISMATCH expected=$expected_version actual=$observed" >&2
              exit 1
            }
          done

          cargo_version="$(awk -F' *= *' '$1=="version"{gsub(/"/,"",$2); print $2; exit}' app/lex-desktop/src-tauri/Cargo.toml)"
          [[ "$cargo_version" == "$expected_version" ]] || {
            echo "PROVENANCE_CARGO_VERSION_MISMATCH expected=$expected_version actual=$cargo_version" >&2
            exit 1
          }

          grep -q "$expected_icon_sha" app/installer/materialize-brand-icon.ps1 || {
            echo "PROVENANCE_BRAND_ICON_HASH_NOT_PINNED" >&2
            exit 1
          }

          printf 'PROVENANCE_PASS baseline=%s branch=%s source=%s version=%s icon=%s\n'             "$baseline" "$work_branch" "$GITHUB_SHA" "$expected_version" "$expected_icon_sha"

  runtime:
    name: Runtime and Gate I audit
    uses: ./.github/workflows/lex-runtime.yml

  structural:
    name: Structural corpus audit
    uses: ./.github/workflows/f138-structural-audit.yml

  installer-state:
    name: Installer state audit
    uses: ./.github/workflows/g39-installer-state.yml

  online:
    name: Accepted online installer
    needs:
      - provenance
      - runtime
      - structural
      - installer-state
    uses: ./.github/workflows/lex-installer.yml

  publish:
    name: Publish exact accepted online installer
    needs:
      - provenance
      - runtime
      - structural
      - installer-state
      - online
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download accepted online installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LexMachina-Windows-Online-Installer
          path: release-input

      - name: Verify receipt and assemble immutable release payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out

          installer="$(find release-input -type f -name '*.exe' -print -quit)"
          receipt="$(find release-input -type f -name 'SHA256.txt' -print -quit)"

          [[ -n "$installer" && -f "$installer" ]] || {
            echo "ONLINE_INSTALLER_MISSING" >&2
            exit 1
          }
          [[ -n "$receipt" && -f "$receipt" ]] || {
            echo "ONLINE_INSTALLER_RECEIPT_MISSING" >&2
            exit 1
          }

          expected="$(awk -F= '$1=="sha256"{print $2}' "$receipt" | tr -d '\r\n ')"
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$expected" != "$actual" ]]; then
            echo "ONLINE_INSTALLER_HASH_MISMATCH expected=$expected actual=$actual" >&2
            exit 1
          fi

          target="release-out/Lex-Machina-0.1.6-G39M-RC14-Online-x64-Setup.exe"
          cp "$installer" "$target"
          cp "$receipt" release-out/CI-SHA256-ONLINE.txt
          sha256sum "$target" > release-out/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > release-out/SOURCE-SHA.txt
          printf '%s  %s\n'             "055686adddaf980c1e2a92bd7957090fdac349529dbf60bc85fd0ef26e367b76"             "app/lex-desktop/src-tauri/icons/icon.ico"             > release-out/BRAND-ICON-SHA256.txt
          cp app/lex-version.yaml release-out/LEX-VERSION.yaml

          cat release-out/SHA256SUMS.txt
          cat release-out/SOURCE-SHA.txt
          cat release-out/BRAND-ICON-SHA256.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > release-out/RELEASE-NOTES.md <<'EOF'
          ## Lex Machina 0.1.6 — G39M RC14

          RC14 extends the accepted RC13 build with the read-only Polish/EU legal
          source federation while preserving Lex Machina's native verification gates.

          Fixed:
          - current-law verification no longer blocks an entire statute merely
            because effective amendments exist after the latest published text
            jednolity; the runtime uses the official ELI unified base-act text
            and remains fail-closed when that source cannot be established;
          - exact statutory articles are extracted from official HTML/PDF and
            their verified text is passed to the semantic model;
          - verified judgments, statutes and interpretation sources are rendered
            as active links from ledger-owned source URLs;
          - direct requests for a legal document produce a professionally laid
            out DOCX/ODT artifact instead of chat-only plaintext; when source
            documents contain protected PII, the chat exposes one-time
            reauthorization, per-document alias reversal and final sensitive
            download, while still allowing the tokenized version to be saved;
          - case files support upload, logical folders/moves, OCR/text extraction
            and per-file anonymization/pseudonymization from the Akta workspace;
          - every finalized document keeps its own encrypted privacy vault and
            reversible deanonymizer; final document generation resolves only the
            aliases from the source document vaults recorded in its manifest;
          - the chat composer exposes a multi-select case-file picker with OCR
            and processing readiness status;
          - creating or switching cases remains available while another case is
            generating, and late results cannot overwrite the newly selected case;
          - Mistral NeMo and Bielik local inference now has bounded HTTP response,
            first-content and stream-idle deadlines plus controlled JSON fallback;
          - prawo-pl-mcp 0.2.3 is integrated behind a compact five-tool research
            surface covering SAOS, NSA/CBOSA, ISAP/ELI, KRS, EUREKA/KIS, KIO,
            UODO, EUR-Lex/CJEU, EU Compliance and Legalize;
          - federated MCP retrieval cannot mint Lex VERIFIED markers or replace the
            native current-law/SN verification path; EUREKA/KIO/UODO material is
            explicitly treated as interpretive or decisional material;
          - the Windows private runtime provisions uvx and exposes its private Node
            runtime to the MCP broker, so Python/Node connectors are isolated from
            OCR/NER packages and do not require global runtimes;
          - a local model is not marked READY after health/tokenizer checks alone:
            llama.cpp must pass a real /chat/completions generation probe;
          - regression tests cover silent local SSE streams before the first token
            and streams that stall after generation has begun.

          Safety boundaries remain unchanged: legal verification is fail-closed,
          account/API billing lanes stay separated, privacy vaults remain local
          and encrypted, and local models cannot execute arbitrary host tools.

          EOF
      - name: Create immutable-source prerelease and upload installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.6-g39m-rc14
          RELEASE_TITLE: Lex Machina v0.1.6 G39M RC14
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            [[ "$tag_sha" == "$source_sha" ]] || {
              echo "IMMUTABLE_RELEASE_TAG_MISMATCH tag=$tag_sha source=$source_sha" >&2
              exit 1
            }
            gh release edit "$RELEASE_TAG"               --title "$RELEASE_TITLE"               --notes-file release-out/RELEASE-NOTES.md               --prerelease
          else
            gh release create "$RELEASE_TAG"               --title "$RELEASE_TITLE"               --notes-file release-out/RELEASE-NOTES.md               --prerelease               --target "$source_sha"
          fi

          gh release upload "$RELEASE_TAG" --clobber             release-out/Lex-Machina-0.1.6-G39M-RC14-Online-x64-Setup.exe             release-out/SHA256SUMS.txt             release-out/CI-SHA256-ONLINE.txt             release-out/SOURCE-SHA.txt             release-out/LEX-VERSION.yaml             release-out/BRAND-ICON-SHA256.txt

          gh release view "$RELEASE_TAG" --json url,tagName,name,isPrerelease,publishedAt,targetCommitish
