name: Lex Skill Update Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Skill bundle release version (semver)"
        required: true
        type: string
      min_app_version:
        description: "Minimum compatible Lex Machina app version"
        required: true
        default: "0.1.3"
        type: string
      max_app_version:
        description: "Maximum compatible app version, or - for no maximum"
        required: true
        default: "0.2.0"
        type: string
      key_id:
        description: "Trusted Ed25519 release key id"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-signed-skill-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install runtime dependencies
        working-directory: app/lex-runtime
        run: npm install --no-audit --no-fund

      - name: Validate runtime tests including signed skill index verifier
        working-directory: app/lex-runtime
        run: npm test

      - name: Build deterministic skill bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "lex-skill-release"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $bundle = Join-Path $output "LexMachina-Skills-${{ inputs.version }}.zip"
          Compress-Archive -LiteralPath "Wersja rozwojowa rozpakowana" -DestinationPath $bundle -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
            throw "SKILL_RELEASE_BUNDLE_BUILD_FAILED"
          }
          "LEX_SKILL_RELEASE_DIR=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LEX_SKILL_RELEASE_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require Ed25519 signing secret
        shell: pwsh
        env:
          LEX_SKILL_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.LEX_SKILL_UPDATE_PRIVATE_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LEX_SKILL_UPDATE_PRIVATE_KEY_PEM)) {
            throw "SKILL_RELEASE_PRIVATE_KEY_MISSING"
          }

      - name: Build and sign skill update index
        working-directory: app/lex-runtime
        env:
          LEX_SKILL_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.LEX_SKILL_UPDATE_PRIVATE_KEY_PEM }}
        run: >
          npm run build:skill-update-release --
          "../../Wersja rozwojowa rozpakowana"
          "$env:LEX_SKILL_RELEASE_BUNDLE"
          "$env:LEX_SKILL_RELEASE_DIR"
          "${{ inputs.version }}"
          "${{ inputs.min_app_version }}"
          "${{ inputs.max_app_version }}"
          "${{ inputs.key_id }}"

      - name: Record candidate hashes
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath $env:LEX_SKILL_RELEASE_DIR -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              Write-Host "$($_.Name)  $hash  $($_.Length)"
            }

      - name: Publish signed skill release candidate
        uses: actions/upload-artifact@v4
        with:
          name: LexMachina-Skills-${{ inputs.version }}-Signed-Candidate
          path: |
            ${{ env.LEX_SKILL_RELEASE_DIR }}/*.zip
            ${{ env.LEX_SKILL_RELEASE_DIR }}/LexMachina-Skills-Index.json
            ${{ env.LEX_SKILL_RELEASE_DIR }}/LexMachina-Skills-Index.sig
          if-no-files-found: error
          retention-days: 14
