name: Package analizator-przepisow-v2 portability

on:
  push:
    branches:
      - portability/analizator-przepisow-v2-01
    paths:
      - '.github/workflows/package-analizator-przepisow-v2-portability.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4

      - name: Stage complete skill and minimally adapt runtime layer
        shell: bash
        run: |
          set -euo pipefail
          SRC='Wersja rozwojowa rozpakowana/analizator-przepisow-v2'
          ROOT='staging/analizator-przepisow-v2'
          rm -rf staging
          mkdir -p staging
          cp -a "$SRC" "$ROOT"
          SRC_COUNT=$(find "$SRC" -type f | wc -l | tr -d ' ')
          DST_COUNT=$(find "$ROOT" -type f | wc -l | tr -d ' ')
          echo "original source files=$SRC_COUNT staged=$DST_COUNT"
          test "$SRC_COUNT" = "$DST_COUNT"
          test ! -d "$ROOT/shared"

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('staging/analizator-przepisow-v2/SKILL.md')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              'compatibility: "web_search, web_fetch, show_widget"',
              'compatibility: "live_web_lookup, file_read, optional_interactive_ui"',
              1,
          )

          pat = re.compile(r'description: \|\n(?:  .*\n)+?(?=---\n)', re.M)
          repl = ('description: "Analiza przepisów prawa polskiego: aktualne i historyczne brzmienie, przesłanki, wykładnia, orzecznictwo, zbieg norm, nowelizacje, vacatio legis i zastosowanie do stanu faktycznego."\n')
          text, n = pat.subn(repl, text, count=1)
          if n != 1:
              raise SystemExit('description block not found exactly once')

          adapter = [
              '## ADAPTER RUNTIME — PORTABILITY (ChatGPT / Claude / inne hosty)',
              '',
              'Ta sekcja zmienia wyłącznie sposób wykonania operacji technicznych. Nie zmienia hard gate’ów, hierarchii źródeł, analizy przesłanek, logiki orzeczniczej, historii zmian ani modelu vacatio legis.',
              '',
              '1. `view`, `web_search`, `web_fetch`, `show_widget`, `sendPrompt` i podobne nazwy traktuj jako nazwy operacji semantycznych, jeżeli bieżący host nie udostępnia literalnie narzędzia o tej nazwie. Użyj równoważnej funkcji hosta.',
              '2. `view /mnt/skills/user/analizator-przepisow-v2/...` oznacza świeży odczyt odpowiedniego pliku lokalnego tego skilla, przede wszystkim `references/...`. Nie wymagaj literalnego katalogu `/mnt/skills`.',
              '3. `view /mnt/skills/user/shared/<plik>` oznacza świeży odczyt z osobnego, kanonicznego skilla `shared`. NIE kopiuj `shared` do tej paczki. Jeżeli obowiązkowy zasób shared jest niedostępny, zastosuj fail-closed zamiast zastępować go pamięcią modelu.',
              '4. `web_search` / `web_fetch` oznaczają świeże wyszukanie i odczyt zewnętrznego źródła. Dla przepisów i sygnatur zachowaj istniejący wymóg źródeł oficjalnych/urzędowych i zakaz cytowania z pamięci.',
              '5. `show_widget` oznacza interaktywny widok, jeśli host go obsługuje. Jeżeli nie, zachowaj ten sam model danych, zakładki, drzewo przesłanek i funkcje jako ustrukturyzowany raport, HTML lub natywny artefakt hosta. Brak renderera nie może blokować analizy merytorycznej.',
              '6. `sendPrompt(...)` w opisie widgetu oznacza przekazanie wybranych przez użytkownika parametrów z UI z powrotem do bieżącej rozmowy/zadania. Jeśli host nie ma takiego callbacku, pokaż gotowe polecenie lub użyj natywnego mechanizmu interakcji hosta.',
              '7. Odwołania do innych skilli są integracjami między-skillowymi. Nie kopiuj ich do tej paczki; jeśli integracja nie jest dostępna, wykonaj lokalną część możliwą do wykonania i jawnie oznacz pominięty krok bez wymyślania wyniku.',
              '',
              '**Zasada nadrzędna adaptera:** jeżeli istniejąca instrukcja jest zrozumiała i wykonalna przez bieżący host, wykonaj ją bez konwersji. Adapter działa tylko na rzeczywistej granicy runtime.',
              '',
          ]
          marker = '---\n\n# Analizator Przepisów Prawnych v2'
          if marker not in text:
              raise SystemExit('frontmatter closing marker not found')
          text = text.replace(marker, '---\n\n' + '\n'.join(adapter) + '# Analizator Przepisów Prawnych v2', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify external shared references exist without copying them
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('staging/analizator-przepisow-v2')
          shared = Path('Wersja rozwojowa rozpakowana/shared')
          pats = [
              re.compile(r'/mnt/skills/user/shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml|html))'),
              re.compile(r'(?<![A-Za-z0-9_.\-/])shared/([A-Za-z0-9_.\-/]+\.(?:md|json|txt|py|sh|ya?ml|html))'),
          ]
          refs = set()
          for f in root.rglob('*'):
              if not f.is_file() or f.suffix.lower() not in {'.md','.txt','.json','.py','.sh','.yaml','.yml','.html'}:
                  continue
              try: data = f.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              for p in pats: refs.update(m.group(1) for m in p.finditer(data))
          missing = [r for r in sorted(refs) if not (shared/r).is_file()]
          if missing:
              raise SystemExit('Missing canonical shared dependencies: ' + ', '.join(missing))
          print('Verified external shared references:', len(refs))
          for r in sorted(refs): print('shared/' + r)
          PY

      - name: Manifest checksums and validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          root = Path('staging/analizator-przepisow-v2')
          source = Path('Wersja rozwojowa rozpakowana/analizator-przepisow-v2')
          original_count = sum(1 for p in source.rglob('*') if p.is_file())
          text = (root/'SKILL.md').read_text(encoding='utf-8')
          m = re.search(r'^description:\s*"(.*?)"\s*$', text, re.M)
          if not m: raise SystemExit('portable description not found')
          desc_len = len(m.group(1))
          if desc_len > 200: raise SystemExit(f'description too long: {desc_len}')

          manifest = [
              '# Portability manifest — analizator-przepisow-v2','',
              '- Source repository: `michaleiatrak-star/Lex-Machina`',
              '- Source commit: `bdebb4b0b6ba63add44501795c6e4acdc5bfd931`',
              '- Original skill tree SHA: `ec65a43dca61467ea24157583a361739e1faab8e`',
              f'- Original skill files copied before portability additions: **{original_count}**',
              f'- Frontmatter description length: **{desc_len}/200**','',
              '## Zasada shared','',
              '`shared` pozostaje osobnym kanonicznym skillem. Ten ZIP NIE zawiera kopii plików `shared`; build jedynie potwierdza istnienie referencjonowanych zasobów w kanonicznym katalogu repo.','',
              '## Zmiany wyłącznie runtime portability','',
              '1. Neutralne capability metadata zamiast nazw narzędzi jednego hosta.',
              '2. Skrócony tylko frontmatter `description`; szczegółowe triggery i funkcje pozostają w treści.',
              '3. Dodany adapter dla legacy `view`, `web_search`, `web_fetch`, `show_widget`, `sendPrompt` i `/mnt/...`.',
              '4. Moduły analizy, orzecznictwa, historii zmian, vacatio legis, drzewo przesłanek i schemat widgetu nie zostały przepisane.',
              '5. Inne skille, w tym `shared`, pozostają odrębne.','',
              '## Zasada nienaruszania instrukcji','',
              'Instrukcje zrozumiałe i wykonalne przez host pozostają bez zmian; adapter działa wyłącznie na granicy runtime.',''
          ]
          (root/'PORTABILITY-MANIFEST.md').write_text('\n'.join(manifest), encoding='utf-8')
          rows=[]
          for f in sorted(p for p in root.rglob('*') if p.is_file() and p.name!='CHECKSUMS.sha256'):
              rows.append(f'{hashlib.sha256(f.read_bytes()).hexdigest()}  {f.relative_to(root).as_posix()}')
          (root/'CHECKSUMS.sha256').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY

          ROOT='staging/analizator-przepisow-v2'
          COUNT=$(find "$ROOT" -type f | wc -l | tr -d ' ')
          echo "FINAL_FILES=$COUNT"
          if [ "$COUNT" -gt 200 ]; then echo "ERROR: final skill has $COUNT files" >&2; exit 1; fi
          test -f "$ROOT/SKILL.md"
          test -f "$ROOT/references/CHANGELOG.md"
          test -f "$ROOT/references/MOD-ORZECZ-POWIAZANIA-HISTORIA.md"
          test -f "$ROOT/references/MOD-VACATIO-LEGIS.md"
          test ! -d "$ROOT/shared"
          grep -q '^## ADAPTER RUNTIME — PORTABILITY' "$ROOT/SKILL.md"
          ! grep -q 'compatibility: "web_search, web_fetch, show_widget"' "$ROOT/SKILL.md"
          (cd "$ROOT" && sha256sum -c CHECKSUMS.sha256)

      - name: Upload one skill as one ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: analizator-przepisow-v2
          path: staging
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
