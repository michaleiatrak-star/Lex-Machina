name: Teksty jednolite z ELI (codziennie)

# Raz dziennie: nieaktualne numery t.j. -> najnowsze z ELI, podbicie wersji,
# przepakowanie ZIP-ów, pełna regresja. Wynik trafia do PR na gałęzi
# auto/tj-eli; scalenie zawsze ręczne. PR utworzony tokenem GITHUB_TOKEN nie
# uruchamia innych workflow, dlatego regresja biegnie tutaj, a jej wynik
# jest w opisie PR.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: tj-eli
  cancel-in-progress: false

jobs:
  aktualizacja:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
      BRANCH: auto/tj-eli
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Zależności testów
        run: python3 -m pip install --disable-pip-version-check pyyaml python-docx

      - name: Aktualizacja t.j. z ELI
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/aktualizuj_tj.py --raport "$RUNNER_TEMP/raport.md"

      # Monitoring modułów DR (METODYKA-MODULY-DR W-2, W-5, W-6): nowelizacje po t.j.
      # nieodnotowane w module, zmiany z datą przyszłą i te, które właśnie weszły w życie.
      # Wynik w jednym zgłoszeniu aktualizowanym codziennie; nie blokuje aktualizacji t.j.
      - name: Monitoring zmian w aktach modułów DR
        shell: bash
        run: |
          set -uo pipefail
          python3 "Wersja rozwojowa rozpakowana/audyt-systemu-v4/scripts/check_nowelizacje.py" \
            --root "Wersja rozwojowa rozpakowana" --tylko-wskazania \
            --rejestr "Wersja rozwojowa rozpakowana/prawo-polskie-v2/krajowe/shared/REJESTR-ZMIAN-W-CZASIE.md" \
            --raport "$RUNNER_TEMP/monitoring.md" > "$RUNNER_TEMP/monitoring.txt" 2>&1
          KOD=$?
          tail -5 "$RUNNER_TEMP/monitoring.txt"
          TYTUL="Monitoring zmian w aktach modułów DR"
          NR=$(gh issue list --state open --search "\"$TYTUL\" in:title" --json number -q '.[0].number' 2>/dev/null || true)
          # Zgłoszenie żyje, gdy są znaleziska albo zmiany z datą przyszłą.
          if [ "$KOD" = "0" ] && ! grep -q '^| 20' "$RUNNER_TEMP/monitoring.md" && [ -z "$NR" ]; then
            exit 0
          fi
          if [ -n "$NR" ]; then
            gh issue edit "$NR" --body-file "$RUNNER_TEMP/monitoring.md"
            # Alarm tylko dla zmian, które weszły w życie i czekają na wdrożenie (W-6).
            if grep -qE '^(ZMIANA_WESZLA|WESZLA_PO_PRZEGLADZIE)' "$RUNNER_TEMP/monitoring.txt"; then
              gh issue comment "$NR" --body "$(date -u +%F): zmiany weszły w życie — wdrożyć jako brzmienie obowiązujące (METODYKA-MODULY-DR W-6). $(grep -E '^(ZMIANA_WESZLA|WESZLA_PO_PRZEGLADZIE)' "$RUNNER_TEMP/monitoring.txt" | head -20)"
            fi
          else
            gh issue create --title "$TYTUL" --body-file "$RUNNER_TEMP/monitoring.md"
          fi

      # Zmiana t.j. albo rejestru zmian w czasie (wiersze wchodzące w życie znikają) -> PR.
      - name: Zmiany do PR
        id: zm
        shell: bash
        run: |
          if git diff --quiet; then echo "zmiany=0" >> "$GITHUB_OUTPUT"; else echo "zmiany=1" >> "$GITHUB_OUTPUT"; fi

      - name: Regresja
        if: steps.zm.outputs.zmiany == '1'
        id: regresja
        shell: bash
        run: |
          set -uo pipefail
          python3 "Wersja rozwojowa rozpakowana/audyt-systemu-v4/scripts/run_regression_suite.py" \
            --repo-root "$GITHUB_WORKSPACE/Wersja rozwojowa rozpakowana" > "$RUNNER_TEMP/regresja.txt" 2>&1
          echo "kod=$?" >> "$GITHUB_OUTPUT"
          tail -40 "$RUNNER_TEMP/regresja.txt"

      - name: PR do akceptacji
        if: steps.zm.outputs.zmiany == '1'
        shell: bash
        run: |
          set -euo pipefail
          DZIEN=$(date -u +%F)
          {
            cat "$RUNNER_TEMP/raport.md"
            echo
            cat "$RUNNER_TEMP/monitoring.md" 2>/dev/null || true
            echo
            if [ "${{ steps.regresja.outputs.kod }}" = "0" ]; then
              echo "Regresja: PASS."
            else
              echo "Regresja: FAIL (kod ${{ steps.regresja.outputs.kod }}). Nie scalać przed poprawą."
              echo; echo '```'; tail -40 "$RUNNER_TEMP/regresja.txt"; echo '```'
            fi
          } > "$RUNNER_TEMP/opis.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -q -m "Teksty jednolite z ELI ($DZIEN): automatyczna aktualizacja numerów"
          # Gałąź należy wyłącznie do tego workflow: codziennie od nowa z main.
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "Teksty jednolite z ELI ($DZIEN)" --body-file "$RUNNER_TEMP/opis.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Teksty jednolite z ELI ($DZIEN)" --body-file "$RUNNER_TEMP/opis.md"
          fi
